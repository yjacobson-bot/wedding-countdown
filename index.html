<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>שימי ותמר</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Heebo:wght@300;400;500&display=swap" />
  <style>
    :root {
      --bg:    #080b16;
      --fg:    #ede4cc;
      --muted: #a09278;
      --gold:  #c9a84c;
      --golds: #e2c97e;
      --goldd: #5e4820;
      --div:   rgba(201,168,76,0.28);
      color-scheme: dark;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; background: var(--bg); color: var(--fg);
      font-family: 'Heebo', sans-serif; font-weight: 300; overflow-x: hidden; }

    #bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

    /* ── side ornaments ── absolute, full height */
    .side-orn {
      position: fixed; top: 0; bottom: 0; z-index: 2;
      display: flex; align-items: center; pointer-events: none;
      opacity: 0.55;
    }
    .side-orn.left  { left: clamp(4px, 2vw, 28px); }
    .side-orn.right { right: clamp(4px, 2vw, 28px); transform: scaleX(-1); }
    .side-orn svg { height: min(70vh, 340px); width: auto; }

    /* ── page grid ── */
    .page {
      position: relative; z-index: 1;
      min-height: 100dvh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 0;
      padding-inline: max(48px, 8vw);
      padding-block: calc(env(safe-area-inset-top,0px) + 16px)
                     calc(env(safe-area-inset-bottom,0px) + 16px);
      text-align: center;
    }

    /* ── eyebrow ── */
    .eyebrow {
      font-size: clamp(0.55rem, 1.2vw, 0.7rem);
      letter-spacing: 0.26em; text-transform: uppercase; color: var(--gold);
      margin-bottom: clamp(10px, 2vh, 20px);
    }

    /* ── names — auto-fit to width ── */
    .names-wrap {
      width: 100%;
      display: flex; align-items: center; justify-content: center;
    }
    .names {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300; line-height: 1;
      white-space: nowrap;
      color: var(--fg);
      text-shadow: 0 0 100px rgba(201,168,76,0.2);
      /* font-size set by JS */
      font-size: 10vw;
    }
    .amp {
      font-family: 'Heebo', sans-serif;
      font-size: 0.42em; font-weight: 300;
      color: var(--golds);
      vertical-align: middle;
      margin-inline: 0.2em;
    }

    /* ── ornament divider ── */
    .orndiv {
      display: flex; align-items: center; gap: 8px;
      width: min(280px, 50%);
      margin-block: clamp(8px,1.5vh,16px);
    }
    .orndiv::before, .orndiv::after { content:''; flex:1; height:1px; background:var(--goldd); }
    .dia { width:6px; height:6px; background:var(--gold); transform:rotate(45deg); flex-shrink:0; }

    /* ── dates ── */
    .date-he {
      font-family:'Cormorant Garamond',serif; font-style:italic;
      font-size:clamp(0.8rem,1.8vw,1.05rem); color:var(--golds);
      letter-spacing:0.06em;
    }
    .date-en {
      font-size:clamp(0.58rem,1.2vw,0.7rem); letter-spacing:0.18em;
      text-transform:uppercase; color:var(--muted);
      margin-top: 4px;
    }

    /* ── countdown ── */
    .cd-wrap {
      display:flex; flex-direction:column; align-items:center;
      gap: clamp(8px,1.8vh,18px);
      margin-top: clamp(14px,3vh,30px);
      width: 100%;
    }

    .days-block { display:flex; flex-direction:column; align-items:center; gap:2px; }
    .days-val {
      font-family:'Cormorant Garamond',serif; font-weight:300; line-height:0.9;
      font-variant-numeric:tabular-nums; color:var(--fg);
      text-shadow:0 0 100px rgba(201,168,76,0.28);
      /* font-size set by JS */
      font-size: 18vw;
    }
    .days-lbl {
      font-size:clamp(0.62rem,1.4vw,0.8rem);
      letter-spacing:0.3em; text-transform:uppercase; color:var(--gold); font-weight:500;
    }

    .thin-div { width:min(260px,40%); height:1px; background:var(--div); }

    /* hms */
    .hms {
      direction:ltr;
      display:flex; align-items:flex-start; justify-content:center;
      gap: clamp(8px,3vw,32px);
      width: 90%;
    }
    .hms-u { display:flex; flex-direction:column; align-items:center; gap:3px; flex:1; }
    .hms-v {
      font-family:'Cormorant Garamond',serif; font-weight:300; line-height:1;
      font-variant-numeric:tabular-nums; color:var(--fg);
      /* font-size set by JS */
      font-size: 8vw;
      width: 100%;
    }
    .hms-l {
      font-size:clamp(0.52rem,1.1vw,0.65rem);
      letter-spacing:0.2em; text-transform:uppercase; color:var(--goldd);
      font-weight:500; direction:rtl;
    }
    .colon {
      font-family:'Cormorant Garamond',serif;
      font-size:7vw;
      color:var(--div); line-height:1; padding-top:2px; user-select:none;
      align-self:flex-start; flex-shrink:0;
    }

    @keyframes blink{0%,100%{opacity:1}50%{opacity:.55}}
    .sec-v{animation:blink 1s ease-in-out infinite;}
    @media(prefers-reduced-motion:reduce){.sec-v{animation:none}}

    .done{display:none;font-family:'Cormorant Garamond',serif;font-style:italic;
      font-size:clamp(1.5rem,4vw,3rem);color:var(--golds);}

    .footer{
      font-size:clamp(0.5rem,1vw,0.62rem);
      letter-spacing:0.22em;text-transform:uppercase;color:var(--goldd);
      margin-top:clamp(10px,2vh,20px);
    }
  </style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<audio id="audio" src="music.mp3" loop preload="none"></audio>

<!-- side ornaments -->
<div class="side-orn left">
  <svg viewBox="0 0 40 200" fill="none" xmlns="http://www.w3.org/2000/svg">
    <g stroke="rgba(201,168,76,1)" stroke-width="0.7">
      <line x1="20" y1="0" x2="20" y2="200"/>
      <path d="M20,30 Q6,50 4,100 Q6,150 20,170" fill="none"/>
      <path d="M20,50 Q2,75 1,100 Q2,125 20,150" fill="none" opacity=".5"/>
      <path d="M4,100 Q-2,106 -3,100 Q-2,94 4,100" fill="none" opacity=".4"/>
      <circle cx="20" cy="16" r="2.5" fill="rgba(201,168,76,0.9)" stroke="none"/>
      <circle cx="20" cy="100" r="1.8" fill="rgba(201,168,76,0.6)" stroke="none"/>
      <circle cx="20" cy="184" r="2.5" fill="rgba(201,168,76,0.9)" stroke="none"/>
      <path d="M20,30 Q34,50 36,100 Q34,150 20,170" fill="none" opacity=".3"/>
    </g>
  </svg>
</div>
<div class="side-orn right">
  <svg viewBox="0 0 40 200" fill="none" xmlns="http://www.w3.org/2000/svg">
    <g stroke="rgba(201,168,76,1)" stroke-width="0.7">
      <line x1="20" y1="0" x2="20" y2="200"/>
      <path d="M20,30 Q6,50 4,100 Q6,150 20,170" fill="none"/>
      <path d="M20,50 Q2,75 1,100 Q2,125 20,150" fill="none" opacity=".5"/>
      <path d="M4,100 Q-2,106 -3,100 Q-2,94 4,100" fill="none" opacity=".4"/>
      <circle cx="20" cy="16" r="2.5" fill="rgba(201,168,76,0.9)" stroke="none"/>
      <circle cx="20" cy="100" r="1.8" fill="rgba(201,168,76,0.6)" stroke="none"/>
      <circle cx="20" cy="184" r="2.5" fill="rgba(201,168,76,0.9)" stroke="none"/>
      <path d="M20,30 Q34,50 36,100 Q34,150 20,170" fill="none" opacity=".3"/>
    </g>
  </svg>
</div>

<main class="page">
  <p class="eyebrow">יום החתונה מתקרב</p>

  <div class="names-wrap">
    <h1 class="names" id="names">שימי<span class="amp">&amp;</span>תמר</h1>
  </div>

  <div class="orndiv"><div class="dia"></div></div>
  <p class="date-he">כ״ט חשון תשפ״ז</p>
  <p class="date-en">09 · 11 · 2026 &nbsp;|&nbsp; 18:00</p>

  <div class="cd-wrap" id="cdwrap">
    <div class="days-block">
      <span class="days-val" id="days">--</span>
      <span class="days-lbl">ימים</span>
    </div>
    <div class="thin-div"></div>
    <div class="hms">
      <div class="hms-u">
        <span class="hms-v" id="hours">--</span>
        <span class="hms-l">שעות</span>
      </div>
      <span class="colon">:</span>
      <div class="hms-u">
        <span class="hms-v" id="minutes">--</span>
        <span class="hms-l">דקות</span>
      </div>
      <span class="colon">:</span>
      <div class="hms-u">
        <span class="hms-v sec-v" id="seconds">--</span>
        <span class="hms-l">שניות</span>
      </div>
    </div>
    <p class="done" id="done">🥂 מזל טוב לשימי ותמר! 🥂</p>
  </div>

  <p class="footer">בשעה טובה ומוצלחת</p>
</main>

<script>
/* ════ FIT TEXT — width AND height ════ */
function fitText() {
  const page  = document.querySelector('.page');
  const wrap  = document.querySelector('.names-wrap');
  const nameEl = document.getElementById('names');

  // Step 1: fit names to available width
  const availW = wrap.clientWidth * 0.94;
  let size = 5;
  nameEl.style.fontSize = size + 'vw';
  while (nameEl.scrollWidth < availW && size < 20) { size += 0.2; nameEl.style.fontSize = size + 'vw'; }
  while (nameEl.scrollWidth > availW && size > 3)  { size -= 0.1; nameEl.style.fontSize = size + 'vw'; }

  // Step 2: scale days & hms relative to name (conservative ratios)
  const daysEl = document.querySelector('.days-val');
  daysEl.style.fontSize = (size * 1.05) + 'vw';
  document.querySelectorAll('.hms-v').forEach(e => e.style.fontSize = (size * 0.52) + 'vw');
  document.querySelectorAll('.colon').forEach(e => e.style.fontSize = (size * 0.44) + 'vw');

  // no vertical shrink — let page scroll automatically
}
fitText();
window.addEventListener('resize', fitText);

/* ════ BACKGROUND ════ */
(function(){
  const c=document.getElementById('bg-canvas'),ctx=c.getContext('2d');
  let stars=[],orbs=[];
  function resize(){c.width=innerWidth;c.height=innerHeight;}
  function init(){
    stars=Array.from({length:230},()=>({
      x:Math.random(),y:Math.random(),r:Math.random()*1.3+0.2,
      base:Math.random()*0.5+0.1,speed:Math.random()*0.5+0.2,
      phase:Math.random()*Math.PI*2,gold:Math.random()<0.07
    }));
    orbs=Array.from({length:6},(_,i)=>({
      x:Math.random(),y:Math.random(),
      vx:(Math.random()-.5)*0.00011,vy:(Math.random()-.5)*0.00011,
      r:Math.random()*0.16+0.07,alpha:Math.random()*0.05+0.015,gold:i%2===0
    }));
  }
  let t=0;
  function draw(){
    const W=c.width,H=c.height;
    ctx.clearRect(0,0,W,H); t+=0.011;
    for(const o of orbs){
      o.x+=o.vx;o.y+=o.vy;
      if(o.x<-.2)o.x=1.2;if(o.x>1.2)o.x=-.2;
      if(o.y<-.2)o.y=1.2;if(o.y>1.2)o.y=-.2;
      const g=ctx.createRadialGradient(o.x*W,o.y*H,0,o.x*W,o.y*H,o.r*Math.min(W,H));
      const col=o.gold?'201,168,76':'150,120,255';
      g.addColorStop(0,`rgba(${col},${o.alpha})`);g.addColorStop(1,`rgba(${col},0)`);
      ctx.beginPath();ctx.arc(o.x*W,o.y*H,o.r*Math.min(W,H),0,Math.PI*2);
      ctx.fillStyle=g;ctx.fill();
    }
    for(const s of stars){
      const a=s.base+Math.sin(t*s.speed+s.phase)*0.18;
      ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);
      ctx.fillStyle=s.gold?`rgba(201,168,76,${a})`:`rgba(232,223,200,${a})`;ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  resize();init();draw();addEventListener('resize',resize);
})();

/* ════ COUNTDOWN ════ */
(function(){
  const target=new Date('2026-11-09T18:00:00+02:00').getTime();
  const dE=document.getElementById('days'),hE=document.getElementById('hours'),
        mE=document.getElementById('minutes'),sE=document.getElementById('seconds'),
        doneEl=document.getElementById('done');
  function pad(n){return String(Math.floor(n)).padStart(2,'0');}
  function tick(){
    const diff=target-Date.now();
    if(diff<=0){
      document.querySelector('.days-block').style.display='none';
      document.querySelector('.thin-div').style.display='none';
      document.querySelector('.hms').style.display='none';
      doneEl.style.display='block'; return;
    }
    const s=diff/1000;
    dE.textContent=Math.floor(s/86400);
    hE.textContent=pad((s%86400)/3600);
    mE.textContent=pad((s%3600)/60);
    sE.textContent=pad(s%60);
    setTimeout(tick,1000-(Date.now()%1000));
  }
  tick();
})();

/* ════ AUTO SCROLL ════ */
(function(){
  const SPEED = 0.6;   // px per frame (~36px/sec at 60fps)
  const PAUSE = 120;   // frames to pause at top/bottom (~2 sec)
  let dir = 1, pause = PAUSE;

  function step() {
    const maxY = document.body.scrollHeight - window.innerHeight;
    if (maxY <= 0) { requestAnimationFrame(step); return; }

    if (pause > 0) { pause--; requestAnimationFrame(step); return; }

    window.scrollBy(0, SPEED * dir);
    const y = window.scrollY;

    if (y >= maxY - 1) { dir = -1; pause = PAUSE; }
    if (y <= 0)        { dir =  1; pause = PAUSE; }

    requestAnimationFrame(step);
  }

  // pause scroll while user interacts
  let userScrolling = false, timeout;
  window.addEventListener('wheel',      () => { userScrolling=true; clearTimeout(timeout); timeout=setTimeout(()=>userScrolling=false,2000); }, {passive:true});
  window.addEventListener('touchmove',  () => { userScrolling=true; clearTimeout(timeout); timeout=setTimeout(()=>userScrolling=false,2000); }, {passive:true});

  function loop() { if (!userScrolling) step(); else requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
})();

/* ════ MUSIC ════ */
(function(){
  const audio=document.getElementById('audio');
  audio.volume=0.5;
  function start(){audio.play().catch(()=>{});}
  document.addEventListener('click',start,{once:true});
  document.addEventListener('touchstart',start,{once:true,passive:true});
  document.addEventListener('keydown',start,{once:true});
})();
</script>
</body>
</html>
