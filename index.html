<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>שימי ותמר</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Heebo:wght@300;400;500&display=swap" />
  <style>
    /* ── tokens ── starry midnight wedding ── */
    :root {
      --bg:        #080b16;
      --fg:        #ede4cc;
      --fg-muted:  #a99d85;
      --gold:      #c9a84c;
      --gold-soft: #e2c97e;
      --gold-dim:  #6a5428;
      --divider:   rgba(201,168,76,0.3);
      color-scheme: dark;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Heebo', 'Arial', sans-serif;
      font-weight: 300;
      overflow-x: hidden;
    }

    /* ── canvas ── */
    #bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ── layout ── */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-inline: max(16px, env(safe-area-inset-right, 16px));
      padding-block: calc(env(safe-area-inset-top, 0px) + 40px) calc(env(safe-area-inset-bottom, 0px) + 40px);
      text-align: center;
      gap: 0;
    }

    /* ── eyebrow ── */
    .eyebrow {
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 24px;
    }

    /* ── names — single line ── */
    .names {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(3rem, 12vw, 7.8rem);
      font-weight: 300;
      line-height: 1;
      letter-spacing: 0.02em;
      white-space: nowrap;
      color: var(--fg);
      text-shadow: 0 0 80px rgba(201,168,76,0.2);
    }
    .names .amp {
      font-style: italic;
      color: var(--gold-soft);
      margin-inline: 0.15em;
    }

    /* ── ornament ── */
    .ornament {
      display: flex;
      align-items: center;
      gap: 10px;
      width: min(200px, 60%);
      margin: 26px auto;
    }
    .ornament::before, .ornament::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--gold-dim);
    }
    .diamond { width: 6px; height: 6px; background: var(--gold); transform: rotate(45deg); flex-shrink: 0; }

    /* ── date ── */
    .date-hebrew {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(0.9rem, 2.5vw, 1.1rem);
      color: var(--gold-soft);
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }
    .date-secular {
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      color: var(--fg-muted);
      text-transform: uppercase;
    }

    /* ── countdown wrapper ── */
    .countdown-wrap {
      margin-top: 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    /* ── days block (top row) ── */
    .days-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .days-value {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(6rem, 22vw, 12rem);
      font-weight: 300;
      line-height: 0.9;
      color: var(--fg);
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 80px rgba(201,168,76,0.25);
    }
    .days-label {
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 500;
    }

    /* ── thin divider between rows ── */
    .row-divider {
      width: min(240px, 70%);
      height: 1px;
      background: var(--divider);
    }

    /* ── hms row (left-to-right regardless of page dir) ── */
    .hms-row {
      display: flex;
      flex-direction: row;          /* LTR: hours | minutes | seconds */
      align-items: flex-start;
      justify-content: center;
      gap: clamp(10px, 4vw, 28px);
      direction: ltr;               /* force LTR for this row */
    }
    .hms-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      min-width: 60px;
    }
    .hms-value {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.6rem, 9vw, 5.5rem);
      font-weight: 300;
      line-height: 1;
      color: var(--fg);
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 40px rgba(201,168,76,0.2);
    }
    .hms-label {
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold-dim);
      font-weight: 500;
      direction: rtl;              /* labels stay Hebrew */
    }
    .hms-sep {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2rem, 7vw, 4.5rem);
      color: var(--divider);
      line-height: 1;
      padding-top: 2px;
      user-select: none;
      align-self: flex-start;
    }

    /* ── seconds pulse ── */
    @keyframes pulse {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.65; }
    }
    .sec-val { animation: pulse 1s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .sec-val { animation: none; } }

    /* ── done ── */
    .done-msg {
      display: none;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.8rem, 6vw, 3.2rem);
      font-style: italic;
      color: var(--gold-soft);
      margin-top: 44px;
    }

    /* ── footer ── */
    .footer {
      margin-top: 44px;
      font-size: 0.62rem;
      letter-spacing: 0.2em;
      color: var(--gold-dim);
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>

  <main class="page">
    <p class="eyebrow">יום החתונה מתקרב</p>

    <h1 class="names">שימי<span class="amp">&amp;</span>תמר</h1>

    <div class="ornament"><div class="diamond"></div></div>

    <p class="date-hebrew">כ״ט חשון תשפ״ז</p>
    <p class="date-secular">09 · 11 · 2026 &nbsp;|&nbsp; 18:00</p>

    <!-- countdown -->
    <div class="countdown-wrap" id="countdown-wrap">

      <!-- days — top row -->
      <div class="days-block">
        <span class="days-value" id="days">--</span>
        <span class="days-label">ימים</span>
      </div>

      <div class="row-divider"></div>

      <!-- hours : minutes : seconds — LTR row -->
      <div class="hms-row">
        <div class="hms-unit">
          <span class="hms-value" id="hours">--</span>
          <span class="hms-label">שעות</span>
        </div>
        <span class="hms-sep">:</span>
        <div class="hms-unit">
          <span class="hms-value" id="minutes">--</span>
          <span class="hms-label">דקות</span>
        </div>
        <span class="hms-sep">:</span>
        <div class="hms-unit">
          <span class="hms-value sec-val" id="seconds">--</span>
          <span class="hms-label">שניות</span>
        </div>
      </div>
    </div>

    <p class="done-msg" id="done-msg">🥂 מזל טוב לשימי ותמר! 🥂</p>

    <p class="footer">בשעה טובה ומוצלחת</p>
  </main>

  <script>
    /* ════════════════════════════════════════
       BACKGROUND: stars + floating light orbs
    ════════════════════════════════════════ */
    (function () {
      const canvas = document.getElementById('bg-canvas');
      const ctx    = canvas.getContext('2d');

      /* stars */
      let stars = [];
      const N_STARS = 240;

      /* orbs — slow drifting light blobs */
      let orbs = [];
      const N_ORBS = 7;

      function resize() {
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      function initStars() {
        stars = Array.from({ length: N_STARS }, () => ({
          x: Math.random(), y: Math.random(),
          r: Math.random() * 1.3 + 0.2,
          base: Math.random() * 0.55 + 0.1,
          speed: Math.random() * 0.5 + 0.2,
          phase: Math.random() * Math.PI * 2,
          gold: Math.random() < 0.07
        }));
      }

      function initOrbs() {
        orbs = Array.from({ length: N_ORBS }, (_, i) => ({
          x: Math.random(),
          y: Math.random(),
          vx: (Math.random() - 0.5) * 0.00015,
          vy: (Math.random() - 0.5) * 0.00015,
          r: Math.random() * 0.18 + 0.08,   /* fraction of screen */
          alpha: Math.random() * 0.06 + 0.02,
          hue: i % 2 === 0 ? 'rgba(201,168,76,' : 'rgba(180,150,255,'
        }));
      }

      let t = 0;
      function draw() {
        const W = canvas.width, H = canvas.height;
        ctx.clearRect(0, 0, W, H);
        t += 0.012;

        /* orbs */
        for (const o of orbs) {
          o.x += o.vx; o.y += o.vy;
          if (o.x < -0.2) o.x = 1.2;
          if (o.x > 1.2)  o.x = -0.2;
          if (o.y < -0.2) o.y = 1.2;
          if (o.y > 1.2)  o.y = -0.2;
          const grad = ctx.createRadialGradient(
            o.x * W, o.y * H, 0,
            o.x * W, o.y * H, o.r * Math.min(W, H)
          );
          grad.addColorStop(0, o.hue + o.alpha + ')');
          grad.addColorStop(1, o.hue + '0)');
          ctx.beginPath();
          ctx.arc(o.x * W, o.y * H, o.r * Math.min(W, H), 0, Math.PI * 2);
          ctx.fillStyle = grad;
          ctx.fill();
        }

        /* stars */
        for (const s of stars) {
          const a = s.base + Math.sin(t * s.speed + s.phase) * 0.2;
          ctx.beginPath();
          ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
          ctx.fillStyle = s.gold
            ? `rgba(201,168,76,${a})`
            : `rgba(232,223,200,${a})`;
          ctx.fill();
        }

        requestAnimationFrame(draw);
      }

      resize();
      initStars();
      initOrbs();
      draw();
      window.addEventListener('resize', resize);
    })();

    /* ════════════════════════════════════
       COUNTDOWN
    ════════════════════════════════════ */
    (function () {
      const target = new Date('2026-11-09T18:00:00+02:00').getTime();

      const dEl  = document.getElementById('days');
      const hEl  = document.getElementById('hours');
      const mEl  = document.getElementById('minutes');
      const sEl  = document.getElementById('seconds');
      const wrap = document.getElementById('countdown-wrap');
      const done = document.getElementById('done-msg');

      function pad(n) { return String(Math.floor(n)).padStart(2, '0'); }

      function tick() {
        const diff = target - Date.now();
        if (diff <= 0) {
          wrap.style.display = 'none';
          done.style.display = 'block';
          return;
        }
        const totalSec = diff / 1000;
        dEl.textContent = Math.floor(totalSec / 86400);
        hEl.textContent = pad((totalSec % 86400) / 3600);
        mEl.textContent = pad((totalSec % 3600) / 60);
        sEl.textContent = pad(totalSec % 60);
        setTimeout(tick, 1000 - (Date.now() % 1000));
      }

      tick();
    })();
  </script>
</body>
</html>
