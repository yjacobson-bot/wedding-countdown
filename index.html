    #bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

    .page {
      position: relative; z-index: 1;
      height: 100dvh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: space-evenly;
      padding-inline: 6vw;
      padding-block: calc(env(safe-area-inset-top,0px) + 1vh)
                     calc(env(safe-area-inset-bottom,0px) + 1vh);
      text-align: center;
    }

    .top { display: flex; flex-direction: column; align-items: center; gap: 0.6vh; }

    .eyebrow {
      font-size: clamp(0.5rem, 1vw, 0.7rem);
      letter-spacing: 0.28em; text-transform: uppercase; color: var(--gold);
    }

    /* ornamental frame around names */
    .names-frame {
      display: flex; flex-direction: column; align-items: center; gap: 0.5vh;
    }
    .orn-line {
      display: flex; align-items: center; gap: 8px;
      color: var(--gold); font-size: 0.7rem; letter-spacing: 0.08em;
      opacity: 0.85; user-select: none;
    }
    .orn-line::before, .orn-line::after {
      content: ''; flex: 1; max-width: 55px; height: 1px;
    }
    .orn-line::before { background: linear-gradient(to right, transparent, #c9a84c); }
    .orn-line::after  { background: linear-gradient(to left,  transparent, #c9a84c); }

    .names {
      font-family: 'Frank Ruhl Libre', 'Cormorant Garamond', serif; font-weight: 400;
      font-size: min(11vw, 17vh);
      line-height: 1; white-space: nowrap;
      background: linear-gradient(160deg, #f5eedd 10%, #f0d98a 40%, #c9a84c 60%, #f0d98a 75%, #f5eedd 95%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 40px rgba(201,168,76,0.55)) drop-shadow(0 0 80px rgba(201,168,76,0.2));
      position: relative; overflow: hidden;
    }
    .names::after {
      content: '';
      position: absolute;
      top: -10%; left: -80%;
      width: 60%; height: 120%;
      background: linear-gradient(105deg, transparent 30%, rgba(255,240,160,0.55) 50%, transparent 70%);
      transform: skewX(-15deg);
      animation: shimmer 9s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes shimmer {
      0%   { left: -80%; opacity: 0; }
      8%   { opacity: 1; }
      55%  { left: 120%; opacity: 1; }
      62%  { left: 120%; opacity: 0; }
      100% { left: 120%; opacity: 0; }
    }
    @media (prefers-reduced-motion:reduce) { .names::after { animation: none; } }

    .amp {
      font-family: 'Heebo', sans-serif; font-size: 0.45em;
      background: none; -webkit-text-fill-color: var(--golds);

    .name-btn { transition: filter 0.25s; }

      filter: drop-shadow(0 0 18px rgba(201,168,76,0.7));
    }

    /* breathing names */
    @keyframes breathe {
      0%,100% { opacity: 0.85; transform: scale(1);    filter: brightness(1);   }
      50%      { opacity: 1;    transform: scale(1.025); filter: brightness(1.15); }
    }
    .names { animation: breathe 4s ease-in-out infinite; }
    @media (prefers-reduced-motion:reduce) { .names { animation: none; } }

    /* amp spark container */
    .amp-wrap { position: relative; display: inline-block; vertical-align: middle; }
    .spark {
      position: absolute;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--golds);
      pointer-events: none;
      opacity: 0;
    }

    /* נותרו label */
    .notaru {
      font-family: 'Cormorant Garamond', serif; font-style: italic;
      font-size: clamp(2rem, 6vw, 4.5rem);
      color: var(--golds); letter-spacing: 0.18em;
      margin-bottom: -0.15em;
      text-shadow: 0 0 30px rgba(201,168,76,0.5);
      line-height: 1;
    }

    .orndiv {
      display: flex; align-items: center; gap: 8px;
      width: min(200px, 40vw);
    }
    .orndiv::before, .orndiv::after { content:''; flex:1; height:1px; background:var(--goldd); }
    .dia { width:5px; height:5px; background:var(--gold); transform:rotate(45deg); flex-shrink:0; }

    .dates { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .date-he {
      font-family:'Cormorant Garamond',serif; font-style:italic;

    }
    .date-en {
      font-size: clamp(0.55rem, 1vw, 0.72rem);
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted);
    }

    .middle {
      display: flex; align-items: center; justify-content: center; gap: 3vw;

    }

    .orn-side svg {
      height: min(18vh, 140px); width: auto; opacity: 0.5;

    }
    .orn-side.flip { transform: scaleX(-1); }

    .days-block { display: flex; flex-direction: column; align-items: center; gap: 0; }

    .thin-div { width: min(180px, 35vw); height: 1px; background: var(--div); }

  </style>
</head>

<script>
/* ══════════════════════════════════════════
   SHARED BEAT STATE
══════════════════════════════════════════ */
let beatEnergy = 0; // 0-1, updated by audio engine

/* ══════════════════════════════════════════
   CANVAS — stars, meteors, falling ornaments
══════════════════════════════════════════ */
(function(){
  const c   = document.getElementById('bg-canvas');
  const ctx = c.getContext('2d');

  function resize(){ c.width=innerWidth; c.height=innerHeight; }

  /* ── static stars ── */
  let stars = [];
  function initStars(){
    stars = Array.from({length:230}, () => ({
      x:Math.random(), y:Math.random(),
      r:Math.random()*1.3+0.2,
      base:Math.random()*0.5+0.1,
      speed:Math.random()*0.5+0.2,
      phase:Math.random()*Math.PI*2,
      gold:Math.random()<0.07
    }));
  }

  /* ── drifting orbs ── */
  let orbs = [];
  function initOrbs(){
    orbs = Array.from({length:6},(_,i)=>({
      x:Math.random(), y:Math.random(),
      vx:(Math.random()-.5)*0.00011, vy:(Math.random()-.5)*0.00011,
      r:Math.random()*0.16+0.07, alpha:Math.random()*0.05+0.015,
      gold:i%2===0
    }));
  }

  /* ── shooting stars ── */
  let meteors = [];
  function spawnMeteor(m){
    const fromLeft = m.side==='left';
    const angle = (Math.random()*25+10)*Math.PI/180;
    m.speed = Math.random()*7+5;
    m.vx = fromLeft ?  Math.cos(angle)*m.speed : -Math.cos(angle)*m.speed;
    m.vy = Math.sin(angle)*m.speed;
    m.x  = fromLeft ? Math.random()*c.width*0.2 : c.width*0.8+Math.random()*c.width*0.2;
    m.y  = Math.random()*c.height*0.55;
    m.maxLife = Math.random()*45+35;
    m.life = m.maxLife;
    m.active = true;
  }
  function initMeteors(){
    meteors = Array.from({length:14},(_,i)=>({
      active:false, timer:Math.random()*120+20, side:i<7?'left':'right'
    }));
  }

  /* ── falling ornaments ── */
  const ORN_COUNT = 28;
  let orns = [];
  function initOrns(){
    orns = Array.from({length:ORN_COUNT}, () => makeOrn(true));
  }
  function makeOrn(randomY){
    const type = Math.random() < 0.5 ? 'diamond' : (Math.random()<0.5 ? 'sparkle' : 'ring');
    return {
      x      : Math.random(),
      y      : randomY ? Math.random() : -0.05,
      size   : Math.random()*5+3,
      speed  : Math.random()*0.0008+0.0003,
      drift  : (Math.random()-.5)*0.0003,
      driftF : Math.random()*0.8+0.3,
      driftP : Math.random()*Math.PI*2,
      rot    : Math.random()*Math.PI,
      rotV   : (Math.random()-.5)*0.03,
      alpha  : Math.random()*0.5+0.25,
      gold   : Math.random()<0.75,
      type
    };
  }

  function drawDiamond(x,y,s,rot,alpha,gold){
    ctx.save();
    ctx.translate(x,y); ctx.rotate(rot);
    const col = gold ? `rgba(201,168,76,${alpha})` : `rgba(232,220,180,${alpha})`;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(0,-s); ctx.lineTo(s*0.55,0); ctx.lineTo(0,s); ctx.lineTo(-s*0.55,0);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawSparkle(x,y,s,rot,alpha,gold){
    ctx.save();
    ctx.translate(x,y); ctx.rotate(rot);
    const col = gold ? `rgba(225,195,100,${alpha})` : `rgba(240,230,200,${alpha})`;
    ctx.strokeStyle = col; ctx.lineWidth = 0.8;
    for(let i=0;i<4;i++){
      ctx.rotate(Math.PI/4);
      ctx.beginPath();
      ctx.moveTo(0,-s*1.4); ctx.lineTo(0,-s*0.3);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawRing(x,y,s,alpha,gold){
    ctx.beginPath();
    ctx.arc(x,y,s,0,Math.PI*2);
    const col = gold ? `rgba(201,168,76,${alpha*0.7})` : `rgba(230,215,170,${alpha*0.7})`;
    ctx.strokeStyle = col; ctx.lineWidth = 0.7;
    ctx.stroke();
  }

  let t = 0;
  function draw(){
    const W=c.width, H=c.height;
    ctx.clearRect(0,0,W,H);
    t += 0.011;

    const beat = beatEnergy; // 0-1

    /* orbs */
    for(const o of orbs){
      o.x+=o.vx; o.y+=o.vy;
      if(o.x<-.2)o.x=1.2; if(o.x>1.2)o.x=-.2;
      if(o.y<-.2)o.y=1.2; if(o.y>1.2)o.y=-.2;
      const g=ctx.createRadialGradient(o.x*W,o.y*H,0,o.x*W,o.y*H,o.r*Math.min(W,H));
      const col=o.gold?'201,168,76':'150,120,255';
      const a = o.alpha*(1+beat*0.6);
      g.addColorStop(0,`rgba(${col},${a})`); g.addColorStop(1,`rgba(${col},0)`);
      ctx.beginPath(); ctx.arc(o.x*W,o.y*H,o.r*Math.min(W,H)*(1+beat*0.15),0,Math.PI*2);
      ctx.fillStyle=g; ctx.fill();
    }

    /* stars */
    for(const s of stars){
      const a = s.base + Math.sin(t*s.speed+s.phase)*0.18 + beat*0.2;
      ctx.beginPath(); ctx.arc(s.x*W, s.y*H, s.r*(1+beat*0.4), 0, Math.PI*2);
      ctx.fillStyle = s.gold?`rgba(201,168,76,${a})`:`rgba(232,223,200,${a})`;
      ctx.fill();
    }

    /* shooting stars */
    for(const m of meteors){
      if(!m.active){ m.timer--; if(m.timer<=0) spawnMeteor(m); continue; }
      m.x+=m.vx; m.y+=m.vy; m.life--;
      const prog=1-m.life/m.maxLife;
      const alpha=prog<0.2?prog/0.2:(prog>0.8?(1-prog)/0.2:1);
      const tailLen=m.speed*18;
      const gm=ctx.createLinearGradient(m.x,m.y,m.x-m.vx*tailLen/m.speed,m.y-m.vy*tailLen/m.speed);
      gm.addColorStop(0,`rgba(255,240,180,${0.9*alpha})`);
      gm.addColorStop(1,'rgba(201,168,76,0)');
      ctx.beginPath(); ctx.moveTo(m.x,m.y);
      ctx.lineTo(m.x-m.vx*tailLen/m.speed,m.y-m.vy*tailLen/m.speed);
      ctx.strokeStyle=gm; ctx.lineWidth=1.5; ctx.stroke();
      const gh=ctx.createRadialGradient(m.x,m.y,0,m.x,m.y,4);
      gh.addColorStop(0,`rgba(255,248,200,${0.8*alpha})`); gh.addColorStop(1,'rgba(255,248,200,0)');
      ctx.beginPath(); ctx.arc(m.x,m.y,4,0,Math.PI*2); ctx.fillStyle=gh; ctx.fill();
      if(m.life<=0){ m.active=false; m.timer=Math.random()*180+80; }
    }

    /* falling ornaments — beat makes them shimmer */
    for(const o of orns){
      o.y += o.speed * (1 + beat*1.2);
      o.x += Math.sin(t*o.driftF+o.driftP)*o.drift;
      o.rot += o.rotV;
      const edgeFade = Math.min(o.y*8, (1-o.y)*8, 1);
      const a = o.alpha * edgeFade * (1 + beat*0.5);
      const px = ((o.x%1+1)%1)*W, py = o.y*H;
      if(o.type==='diamond')  drawDiamond(px,py,o.size,o.rot,a,o.gold);
      else if(o.type==='sparkle') drawSparkle(px,py,o.size,o.rot,a,o.gold);
      else                    drawRing(px,py,o.size,a,o.gold);
      if(o.y>1.05) Object.assign(o, makeOrn(false));
    }

    requestAnimationFrame(draw);
  }

  resize(); initStars(); initOrbs(); initMeteors(); initOrns();
  draw();
  addEventListener('resize', resize);
})();

/* ══════════════════════════════════════════
   COUNTDOWN
══════════════════════════════════════════ */
(function(){
  const target = new Date('2026-11-09T18:00:00+02:00').getTime();
  const dE=document.getElementById('days'),
        hE=document.getElementById('hours'),
        mE=document.getElementById('minutes'),
        sE=document.getElementById('seconds'),
        doneEl=document.getElementById('done');
  function pad(n){ return String(Math.floor(n)).padStart(2,'0'); }
  function tick(){
    const diff = target-Date.now();
    if(diff<=0){
      document.querySelector('.days-block').style.display='none';
      document.querySelector('.thin-div').style.display='none';
      document.getElementById('hms').style.display='none';
      doneEl.style.display='block'; return;
    }
    const s=diff/1000;
    dE.textContent=Math.floor(s/86400);
    hE.textContent=pad((s%86400)/3600);
    mE.textContent=pad((s%3600)/60);
    sE.textContent=pad(s%60);
    setTimeout(tick, 1000-(Date.now()%1000));
  }
  tick();
})();

/* ══════════════════════════════════════════
   BEAT-SYNC DOM PULSE
══════════════════════════════════════════ */
(function(){
  const daysEl    = document.getElementById('days');
  const ornLeft   = document.getElementById('orn-left');
  const ornRight  = document.getElementById('orn-right');
  let smoothBeat  = 0;
  let lastBeat    = 0;
  const THRESH    = 0.45;

  function pulse(){
    smoothBeat += (beatEnergy - smoothBeat) * 0.18;
    const s = 1 + smoothBeat * 0.06;
    daysEl.style.transform   = `scale(${s})`;
    daysEl.style.textShadow  = `0 0 ${120+smoothBeat*80}px rgba(201,168,76,${0.25+smoothBeat*0.4})`;
    ornLeft.style.opacity    = 0.5 + smoothBeat*0.5;
    ornRight.style.opacity   = 0.5 + smoothBeat*0.5;
    lastBeat = smoothBeat;
    requestAnimationFrame(pulse);
  }
  pulse();
})();

/* ══════════════════════════════════════════
   AUDIO ENGINE — Web Audio API + crossfade
══════════════════════════════════════════ */
(function(){
  const GROOM_IDS = ['ag1','ag2','ag3','ag4','ag5'];
  const BRIDE_IDS = ['ab1','ab2','ab3','ab4','ab5'];
  const FADE_DUR  = 3.0; // seconds crossfade

  let audioCtx, analyser, freqData;
  const nodes = {}; // id -> { audio, gain, _check, _ended }
  let activeIds = null;
  let currentId = null;

  function initCtx(){
    if(audioCtx) return;
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.82;
    freqData = new Uint8Array(analyser.frequencyBinCount);
    analyser.connect(audioCtx.destination);

    [...GROOM_IDS,...BRIDE_IDS].forEach(id => {
      const audio = document.getElementById(id);
      try {
        const src  = audioCtx.createMediaElementSource(audio);
        const gain = audioCtx.createGain();
        gain.gain.value = 0;
        src.connect(gain);
        gain.connect(analyser);
        nodes[id] = { audio, gain, _check:null, _ended:null };
      } catch(e){ nodes[id] = { audio, gain:null, _check:null, _ended:null }; }
    });

    /* beat detection loop */
    (function beatLoop(){
      if(analyser){
        analyser.getByteFrequencyData(freqData);
        let sum=0;
        for(let i=0;i<10;i++) sum+=freqData[i];
        beatEnergy = sum/10/255;
      }
      setTimeout(beatLoop, 32);
    })();
  }

  function pickRandom(ids, exclude){
    const pool = ids.length>1 ? ids.filter(x=>x!==exclude) : ids;
    return pool[Math.floor(Math.random()*pool.length)];
  }

  function clearListeners(node){
    if(node._check)  { node.audio.removeEventListener('timeupdate', node._check); node._check=null; }
    if(node._ended)  { node.audio.removeEventListener('ended',      node._ended); node._ended=null; }
  }

  function crossfadeTo(nextId){
    const now  = audioCtx.currentTime;
    const next = nodes[nextId];
    if(!next) return;

    /* fade out & schedule cleanup of current */
    if(currentId && currentId !== nextId){
      const cur = nodes[currentId];
      clearListeners(cur);
      if(cur.gain){
        const g = cur.gain.gain;
        g.cancelScheduledValues(now);
        g.setValueAtTime(g.value, now);
        g.linearRampToValueAtTime(0, now + FADE_DUR);
      }
      const prevId = currentId;
      setTimeout(()=>{
        const p = nodes[prevId];
        p.audio.pause(); p.audio.currentTime = 0;
      }, (FADE_DUR + 0.3) * 1000);
    }

    /* fade in next */
    next.audio.currentTime = 0;
    next.audio.play().catch(()=>{});
    if(next.gain){
      const g = next.gain.gain;
      g.cancelScheduledValues(now);
      g.setValueAtTime(0, now);
      g.linearRampToValueAtTime(0.5, now + FADE_DUR);
    }

    currentId = nextId;

    /* start crossfade FADE_DUR seconds BEFORE song ends */
    let fading = false;
    next._check = function(){
      if(fading || !next.audio.duration) return;
      const remaining = next.audio.duration - next.audio.currentTime;
      if(remaining > 0 && remaining <= FADE_DUR + 0.15){
        fading = true;
        clearListeners(next);
        if(currentId === nextId && activeIds)
          crossfadeTo(pickRandom(activeIds, nextId));
      }
    };
    next._ended = function(){
      if(currentId === nextId && activeIds)
        crossfadeTo(pickRandom(activeIds, nextId));
    };
    next.audio.addEventListener('timeupdate', next._check);
    next.audio.addEventListener('ended',      next._ended, {once:true});
  }

  function startPlaylist(ids){
    activeIds = ids;
    crossfadeTo(pickRandom(ids, null));
  }

  /* ── splash UI ── */
  const splash    = document.getElementById('splash');
  const btnGroom  = document.getElementById('btn-groom');
  const btnBride  = document.getElementById('btn-bride');
  const mainGroom = document.getElementById('main-groom');
  const mainBride = document.getElementById('main-bride');

  [btnGroom,btnBride].forEach(btn=>{
    btn.addEventListener('mouseenter',()=>{
      btn.style.filter='drop-shadow(0 0 20px rgba(201,168,76,0.8)) drop-shadow(0 2px 20px rgba(0,0,0,0.9))';
    });
    btn.addEventListener('mouseleave',()=>{
      btn.style.filter='drop-shadow(0 2px 20px rgba(0,0,0,0.9))';
    });
  });

  function dismiss(who){
    initCtx();
    mainGroom.classList.toggle('active', who==='groom');
    mainBride.classList.toggle('active', who==='bride');
    splash.style.opacity='0';
    setTimeout(()=>splash.style.display='none', 900);
    // resume AudioContext (may be suspended on iOS/Android even after tap)
    const startAfterResume = () => startPlaylist(who==='groom' ? GROOM_IDS : BRIDE_IDS);
    if(audioCtx.state === 'suspended'){
      audioCtx.resume().then(startAfterResume);
    } else {
      startAfterResume();
    }
  }

  btnGroom.addEventListener('click',     ()=>dismiss('groom'), {once:true});
  btnGroom.addEventListener('touchstart',()=>dismiss('groom'), {once:true, passive:true});
  btnBride.addEventListener('click',     ()=>dismiss('bride'),  {once:true});
  btnBride.addEventListener('touchstart',()=>dismiss('bride'),  {once:true, passive:true});
})();

/* ── & spark effect ── */
(function(){
  const ampEl = document.getElementById('amp-el');
  function fireSpark(){
    if(!ampEl) return;
    const rect = ampEl.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top  + rect.height/2;
    for(let i=0;i<8;i++){
      const sp = document.createElement('div');
      document.body.appendChild(sp);
      const angle = (i/8)*Math.PI*2 + Math.random()*0.4;
      const dist  = 25+Math.random()*45;
      const tx = Math.cos(angle)*dist;
      const ty = Math.sin(angle)*dist;
      const size = 3+Math.random()*4;
      sp.style.cssText = `
        position:fixed;z-index:10;pointer-events:none;
        left:${cx}px;top:${cy}px;
        width:${size}px;height:${size}px;border-radius:50%;
        background:${Math.random()<0.6?'#e2c97e':'#fff8d0'};
        transform:translate(-50%,-50%);
        transition:transform ${0.45+Math.random()*0.3}s ease-out,opacity 0.55s ease-out;
        opacity:0.95;box-shadow:0 0 4px rgba(226,201,126,0.8);
      `;
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        sp.style.transform=`translate(calc(-50% + ${tx}px),calc(-50% + ${ty}px)) scale(0.1)`;
        sp.style.opacity='0';
      }));
      setTimeout(()=>sp.remove(), 900);
    }
    setTimeout(fireSpark, 3200+Math.random()*2500);
  }
  setTimeout(fireSpark, 2500);
})();
</script>
