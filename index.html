<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>שימי ותמר</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Heebo:wght@300;400;500&display=swap" />
  <style>
    :root {
      --bg:    #080b16;
      --fg:    #ede4cc;
      --muted: #a09278;
      --gold:  #c9a84c;
      --golds: #e2c97e;
      --goldd: #5e4820;
      --div:   rgba(201,168,76,0.3);
      color-scheme: dark;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%; overflow: hidden;
      background: var(--bg); color: var(--fg);
      font-family: 'Heebo', sans-serif; font-weight: 300;
    }

    #bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

    /* ── full-screen flex layout ── */
    .page {
      position: relative; z-index: 1;
      height: 100dvh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: space-evenly;
      padding-inline: 6vw;
      padding-block: calc(env(safe-area-inset-top,0px) + 1vh)
                     calc(env(safe-area-inset-bottom,0px) + 1vh);
      text-align: center;
    }

    /* ── top section ── */
    .top { display: flex; flex-direction: column; align-items: center; gap: 0.6vh; }

    .eyebrow {
      font-size: clamp(0.5rem, 1vw, 0.7rem);
      letter-spacing: 0.28em; text-transform: uppercase; color: var(--gold);
    }

    .names {
      font-family: 'Cormorant Garamond', serif; font-weight: 300;
      font-size: min(11vw, 17vh);
      line-height: 1; white-space: nowrap; color: var(--fg);
      text-shadow: 0 0 80px rgba(201,168,76,0.18);
    }
    .amp {
      font-family: 'Heebo', sans-serif; font-size: 0.45em;
      color: var(--golds); vertical-align: middle; margin-inline: 0.2em;
    }

    /* ── divider ── */
    .orndiv {
      display: flex; align-items: center; gap: 8px;
      width: min(200px, 40vw);
    }
    .orndiv::before, .orndiv::after { content:''; flex:1; height:1px; background:var(--goldd); }
    .dia { width:5px; height:5px; background:var(--gold); transform:rotate(45deg); flex-shrink:0; }

    /* ── dates ── */
    .dates { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .date-he {
      font-family:'Cormorant Garamond',serif; font-style:italic;
      font-size: clamp(0.75rem, 1.6vw, 1.1rem); color: var(--golds); letter-spacing: 0.05em;
    }
    .date-en {
      font-size: clamp(0.55rem, 1vw, 0.72rem);
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted);
    }

    /* ── middle: side ornaments + days ── */
    .middle {
      display: flex; align-items: center; justify-content: center; gap: 3vw;
      width: 100%;
    }

    .orn-side svg {
      height: min(18vh, 140px); width: auto; opacity: 0.5;
    }
    .orn-side.flip { transform: scaleX(-1); }

    .days-block { display: flex; flex-direction: column; align-items: center; gap: 0.5vh; }
    .days-val {
      font-family: 'Cormorant Garamond', serif; font-weight: 300;
      font-size: min(22vw, 31vh);
      line-height: 0.9; font-variant-numeric: tabular-nums; color: var(--fg);
      text-shadow: 0 0 120px rgba(201,168,76,0.25);
    }
    .days-lbl {
      font-size: clamp(0.6rem, 1.4vw, 0.85rem);
      letter-spacing: 0.32em; text-transform: uppercase; color: var(--gold); font-weight: 500;
    }

    /* ── bottom: hms ── */
    .bottom { display: flex; flex-direction: column; align-items: center; gap: 0.8vh; }

    .thin-div { width: min(180px, 35vw); height: 1px; background: var(--div); }

    .hms {
      direction: ltr;
      display: flex; align-items: flex-start; justify-content: center;
      gap: clamp(6px, 2.5vw, 24px);
    }
    .hms-u { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 3ch; }
    .hms-v {
      font-family: 'Cormorant Garamond', serif; font-weight: 300;
      font-size: min(8.5vw, 12vh);
      line-height: 1; font-variant-numeric: tabular-nums; color: var(--fg);
    }
    .hms-l {
      font-size: clamp(0.5rem, 0.9vw, 0.65rem);
      letter-spacing: 0.2em; text-transform: uppercase; color: var(--goldd); direction: rtl;
    }
    .colon {
      font-family: 'Cormorant Garamond', serif;
      font-size: min(7vw, 10vh);
      color: var(--div); line-height: 1; padding-top: 1px; user-select: none;
    }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.5} }
    .sec-v { animation: blink 1s ease-in-out infinite; }
    @media (prefers-reduced-motion:reduce) { .sec-v { animation:none } }

    .done { display:none; font-family:'Cormorant Garamond',serif; font-style:italic;
      font-size:min(5vw,7vh); color:var(--golds); }

    /* shimmer on names */
    .names {
      position: relative;
      overflow: hidden;
    }
    .names::after {
      content: '';
      position: absolute;
      top: -10%; left: -80%;
      width: 60%; height: 120%;
      background: linear-gradient(
        105deg,
        transparent 30%,
        rgba(255,240,160,0.55) 50%,
        transparent 70%
      );
      transform: skewX(-15deg);
      animation: shimmer 9s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes shimmer {
      0%   { left: -80%; opacity: 0; }
      8%   { opacity: 1; }
      55%  { left: 120%; opacity: 1; }
      62%  { left: 120%; opacity: 0; }
      100% { left: 120%; opacity: 0; }
    }
    @media (prefers-reduced-motion:reduce) { .names::after { animation: none; } }

    .footer {
      font-size: clamp(0.5rem, 0.9vw, 0.65rem);
      letter-spacing: 0.22em; text-transform: uppercase; color: var(--goldd);
    }
  </style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<audio id="audio-groom" src="music.mp3"       loop preload="none"></audio>
<audio id="audio-bride" src="music_bride.mp3" loop preload="none"></audio>

<!-- splash screen -->
<div id="splash" style="
  position:fixed;inset:0;z-index:100;
  background:#080b16;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2.5vh;cursor:pointer;
  transition:opacity 0.9s ease;
  overflow:hidden;
">
  <!-- blurred invitation background -->
  <div style="
    position:absolute;inset:0;
    background:url('invitation.png') center/cover no-repeat;
    filter:blur(4px) brightness(0.45) saturate(0.8);
    transform:scale(1.08);
    z-index:0;
  "></div>
  <!-- content above blur -->
  <div style="position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:3vh;">
    <p style="font-family:'Heebo',sans-serif;font-size:clamp(0.55rem,1.1vw,0.72rem);
      letter-spacing:0.3em;text-transform:uppercase;color:#c9a84c;">
      לחצו על השם שלכם
    </p>

    <!-- clickable names -->
    <div style="display:flex;align-items:center;gap:0.15em;direction:rtl;">
      <span id="btn-groom" style="
        font-family:'Cormorant Garamond',serif;font-weight:300;
        font-size:clamp(3rem,12vw,9rem);color:#ede4cc;line-height:1;
        cursor:pointer;transition:color 0.2s,text-shadow 0.2s;
        text-shadow:0 2px 30px rgba(0,0,0,0.9);
        user-select:none;
      ">שימי</span>
      <span style="
        font-family:'Heebo',sans-serif;font-size:clamp(1.2rem,4vw,3.5rem);
        color:#c9a84c;margin-inline:0.15em;line-height:1;
      ">&amp;</span>
      <span id="btn-bride" style="
        font-family:'Cormorant Garamond',serif;font-weight:300;
        font-size:clamp(3rem,12vw,9rem);color:#ede4cc;line-height:1;
        cursor:pointer;transition:color 0.2s,text-shadow 0.2s;
        text-shadow:0 2px 30px rgba(0,0,0,0.9);
        user-select:none;
      ">תמר</span>
    </div>

    <p style="font-family:'Cormorant Garamond',serif;font-style:italic;
      font-size:clamp(0.85rem,1.8vw,1.2rem);color:#e2c97e;
      text-shadow:0 1px 12px rgba(0,0,0,0.7);">
      כמה זמן נשאר לחתונה?
    </p>
    <div style="width:6px;height:6px;background:#c9a84c;
      transform:rotate(45deg);animation:pulse2 1.4s ease-in-out infinite;"></div>
  </div>
</div>

<style>
@keyframes pulse2{0%,100%{opacity:1;transform:rotate(45deg) scale(1)}
  50%{opacity:0.4;transform:rotate(45deg) scale(1.6)}}
</style>

<main class="page">

  <div class="top">
    <p class="eyebrow">יום החתונה מתקרב</p>
    <h1 class="names">שימי<span class="amp">&amp;</span>תמר</h1>
  </div>

  <div class="dates">
    <div class="orndiv"><div class="dia"></div></div>
    <p class="date-he">כ״ט חשון תשפ״ז</p>
    <p class="date-en">09 · 11 · 2026 &nbsp;|&nbsp; 18:00</p>
  </div>

  <div class="middle">
    <!-- left ornament -->
    <span class="orn-side">
      <svg viewBox="0 0 30 160" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g stroke="rgba(201,168,76,1)" stroke-width="0.7">
          <line x1="15" y1="0" x2="15" y2="160"/>
          <path d="M15,25 Q4,50 3,80 Q4,110 15,135" fill="none"/>
          <path d="M15,40 Q1,65 0,80 Q1,95 15,120" fill="none" opacity=".45"/>
          <circle cx="15" cy="12" r="2" fill="rgba(201,168,76,.9)" stroke="none"/>
          <circle cx="15" cy="80" r="1.5" fill="rgba(201,168,76,.6)" stroke="none"/>
          <circle cx="15" cy="148" r="2" fill="rgba(201,168,76,.9)" stroke="none"/>
        </g>
      </svg>
    </span>

    <div class="days-block">
      <span class="days-val" id="days">--</span>
      <span class="days-lbl">ימים</span>
    </div>

    <!-- right ornament -->
    <span class="orn-side flip">
      <svg viewBox="0 0 30 160" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g stroke="rgba(201,168,76,1)" stroke-width="0.7">
          <line x1="15" y1="0" x2="15" y2="160"/>
          <path d="M15,25 Q4,50 3,80 Q4,110 15,135" fill="none"/>
          <path d="M15,40 Q1,65 0,80 Q1,95 15,120" fill="none" opacity=".45"/>
          <circle cx="15" cy="12" r="2" fill="rgba(201,168,76,.9)" stroke="none"/>
          <circle cx="15" cy="80" r="1.5" fill="rgba(201,168,76,.6)" stroke="none"/>
          <circle cx="15" cy="148" r="2" fill="rgba(201,168,76,.9)" stroke="none"/>
        </g>
      </svg>
    </span>
  </div>

  <div class="bottom">
    <div class="thin-div"></div>
    <div class="hms" id="hms">
      <div class="hms-u">
        <span class="hms-v" id="hours">--</span>
        <span class="hms-l">שעות</span>
      </div>
      <span class="colon">:</span>
      <div class="hms-u">
        <span class="hms-v" id="minutes">--</span>
        <span class="hms-l">דקות</span>
      </div>
      <span class="colon">:</span>
      <div class="hms-u">
        <span class="hms-v sec-v" id="seconds">--</span>
        <span class="hms-l">שניות</span>
      </div>
    </div>
    <p class="done" id="done">🥂 מזל טוב לשימי ותמר! 🥂</p>
  </div>

  <p class="footer">בשעה טובה ומוצלחת</p>
</main>

<script>
/* ════ BACKGROUND ════ */
(function(){
  const c=document.getElementById('bg-canvas'),ctx=c.getContext('2d');
  let stars=[],orbs=[];
  function resize(){c.width=innerWidth;c.height=innerHeight;}
  function init(){
    stars=Array.from({length:230},()=>({
      x:Math.random(),y:Math.random(),r:Math.random()*1.3+0.2,
      base:Math.random()*0.5+0.1,speed:Math.random()*0.5+0.2,
      phase:Math.random()*Math.PI*2,gold:Math.random()<0.07
    }));
    orbs=Array.from({length:6},(_,i)=>({
      x:Math.random(),y:Math.random(),
      vx:(Math.random()-.5)*0.00011,vy:(Math.random()-.5)*0.00011,
      r:Math.random()*0.16+0.07,alpha:Math.random()*0.05+0.015,gold:i%2===0
    }));
  }
  let t=0;
  function draw(){
    const W=c.width,H=c.height;
    ctx.clearRect(0,0,W,H);t+=0.011;
    for(const o of orbs){
      o.x+=o.vx;o.y+=o.vy;
      if(o.x<-.2)o.x=1.2;if(o.x>1.2)o.x=-.2;
      if(o.y<-.2)o.y=1.2;if(o.y>1.2)o.y=-.2;
      const g=ctx.createRadialGradient(o.x*W,o.y*H,0,o.x*W,o.y*H,o.r*Math.min(W,H));
      const col=o.gold?'201,168,76':'150,120,255';
      g.addColorStop(0,`rgba(${col},${o.alpha})`);g.addColorStop(1,`rgba(${col},0)`);
      ctx.beginPath();ctx.arc(o.x*W,o.y*H,o.r*Math.min(W,H),0,Math.PI*2);
      ctx.fillStyle=g;ctx.fill();
    }
    for(const s of stars){
      const a=s.base+Math.sin(t*s.speed+s.phase)*0.18;
      ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);
      ctx.fillStyle=s.gold?`rgba(201,168,76,${a})`:`rgba(232,223,200,${a})`;ctx.fill();
    }
    /* shooting stars */
    for(const m of meteors){
      if(!m.active){
        m.timer-=1;
        if(m.timer<=0) spawnMeteor(m);
        continue;
      }
      m.x+=m.vx; m.y+=m.vy; m.life-=1;
      const prog=1-m.life/m.maxLife;
      const alpha=prog<0.2?prog/0.2:(prog>0.8?(1-prog)/0.2:1);
      const tailLen=m.speed*18;
      const gm=ctx.createLinearGradient(m.x,m.y,m.x-m.vx*tailLen/m.speed,m.y-m.vy*tailLen/m.speed);
      gm.addColorStop(0,`rgba(255,240,180,${0.9*alpha})`);
      gm.addColorStop(1,`rgba(201,168,76,0)`);
      ctx.beginPath();ctx.moveTo(m.x,m.y);
      ctx.lineTo(m.x-m.vx*tailLen/m.speed,m.y-m.vy*tailLen/m.speed);
      ctx.strokeStyle=gm;ctx.lineWidth=1.5;ctx.stroke();
      /* head glow */
      const gh=ctx.createRadialGradient(m.x,m.y,0,m.x,m.y,4);
      gh.addColorStop(0,`rgba(255,248,200,${0.8*alpha})`);gh.addColorStop(1,'rgba(255,248,200,0)');
      ctx.beginPath();ctx.arc(m.x,m.y,4,0,Math.PI*2);ctx.fillStyle=gh;ctx.fill();
      if(m.life<=0){m.active=false;m.timer=Math.random()*300+120;}
    }
    requestAnimationFrame(draw);
  }

  /* meteor pool — converge from left & right toward center */
  let meteors=[];
  function spawnMeteor(m){
    const fromLeft = m.side === 'left';
    const angle=(Math.random()*25+10)*Math.PI/180;
    m.speed=Math.random()*7+5;
    /* left side: shoot right-downward; right side: shoot left-downward */
    m.vx = fromLeft ?  Math.cos(angle)*m.speed : -Math.cos(angle)*m.speed;
    m.vy = Math.sin(angle)*m.speed;
    m.x  = fromLeft ? Math.random()*c.width*0.2 : c.width*0.8+Math.random()*c.width*0.2;
    m.y  = Math.random()*c.height*0.55;
    m.maxLife=Math.random()*45+35;
    m.life=m.maxLife;
    m.active=true;
  }
  meteors=Array.from({length:14},(_,i)=>{
    return {active:false, timer:Math.random()*120+20, side: i<7?'left':'right'};
  });

  resize();init();draw();addEventListener('resize',resize);
})();

/* ════ COUNTDOWN ════ */
(function(){
  const target=new Date('2026-11-09T18:00:00+02:00').getTime();
  const dE=document.getElementById('days'),hE=document.getElementById('hours'),
        mE=document.getElementById('minutes'),sE=document.getElementById('seconds'),
        doneEl=document.getElementById('done');
  function pad(n){return String(Math.floor(n)).padStart(2,'0');}
  function tick(){
    const diff=target-Date.now();
    if(diff<=0){
      document.querySelector('.days-block').style.display='none';
      document.querySelector('.thin-div').style.display='none';
      document.getElementById('hms').style.display='none';
      doneEl.style.display='block';return;
    }
    const s=diff/1000;
    dE.textContent=Math.floor(s/86400);
    hE.textContent=pad((s%86400)/3600);
    mE.textContent=pad((s%3600)/60);
    sE.textContent=pad(s%60);
    setTimeout(tick,1000-(Date.now()%1000));
  }
  tick();
})();

/* ════ SPLASH + MUSIC ════ */
(function(){
  const splash      = document.getElementById('splash');
  const audioGroom  = document.getElementById('audio-groom');
  const audioBride  = document.getElementById('audio-bride');
  const btnGroom    = document.getElementById('btn-groom');
  const btnBride    = document.getElementById('btn-bride');
  audioGroom.volume = 0.5;
  audioBride.volume = 0.5;

  /* hover glow */
  [btnGroom, btnBride].forEach(btn => {
    btn.addEventListener('mouseenter', () => {
      btn.style.color = '#e2c97e';
      btn.style.textShadow = '0 0 40px rgba(201,168,76,0.7), 0 2px 30px rgba(0,0,0,0.9)';
    });
    btn.addEventListener('mouseleave', () => {
      btn.style.color = '#ede4cc';
      btn.style.textShadow = '0 2px 30px rgba(0,0,0,0.9)';
    });
  });

  function dismiss(audio) {
    audio.play().catch(()=>{});
    splash.style.opacity = '0';
    setTimeout(() => splash.style.display = 'none', 900);
  }

  btnGroom.addEventListener('click',     () => dismiss(audioGroom), {once:true});
  btnGroom.addEventListener('touchstart',() => dismiss(audioGroom), {once:true, passive:true});
  btnBride.addEventListener('click',     () => dismiss(audioBride),  {once:true});
  btnBride.addEventListener('touchstart',() => dismiss(audioBride),  {once:true, passive:true});
})();
</script>
</body>
</html>
