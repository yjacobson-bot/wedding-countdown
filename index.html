<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>שימי ותמר</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Heebo:wght@300;400;500&display=swap" />
  <style>
    /* ── tokens ── starry midnight wedding ── */
    :root {
      --bg:        #0b0e1a;
      --bg2:       #111627;
      --fg:        #e8dfc8;
      --fg-muted:  #a99d85;
      --gold:      #c9a84c;
      --gold-soft: #e2c97e;
      --gold-dim:  #7a6230;
      --divider:   rgba(201,168,76,0.25);
      color-scheme: dark;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Heebo', 'Arial', sans-serif;
      font-weight: 300;
      overflow-x: hidden;
    }

    /* ── canvas stars ── */
    #stars-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ── layout ── */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 16px))
               env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 16px));
      padding-block: calc(env(safe-area-inset-top, 0px) + 48px) calc(env(safe-area-inset-bottom, 0px) + 48px);
      gap: 0;
      text-align: center;
    }

    /* ── eyebrow ── */
    .eyebrow {
      font-family: 'Heebo', sans-serif;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 28px;
    }

    /* ── names ── */
    .names {
      font-family: 'Cormorant Garamond', 'David Libre', serif;
      font-size: clamp(3.6rem, 11vw, 7.2rem);
      font-weight: 300;
      line-height: 1.05;
      letter-spacing: 0.01em;
      color: var(--fg);
      text-shadow: 0 0 60px rgba(201,168,76,0.18);
    }

    .names .ampersand {
      display: block;
      font-size: 0.55em;
      font-style: italic;
      font-weight: 300;
      color: var(--gold-soft);
      line-height: 1.4;
    }

    /* ── ornament ── */
    .ornament {
      margin: 28px auto;
      width: 160px;
      height: 1px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .ornament::before,
    .ornament::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold-dim));
    }
    .ornament::after {
      background: linear-gradient(to left, transparent, var(--gold-dim));
    }
    .ornament-diamond {
      width: 6px;
      height: 6px;
      background: var(--gold);
      transform: rotate(45deg);
      flex-shrink: 0;
    }

    /* ── date block ── */
    .date-block {
      margin-bottom: 8px;
    }
    .date-hebrew {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(0.85rem, 2.5vw, 1.05rem);
      font-style: italic;
      color: var(--gold-soft);
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }
    .date-secular {
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      color: var(--fg-muted);
      text-transform: uppercase;
    }

    /* ── countdown ── */
    .countdown {
      margin-top: 42px;
      display: flex;
      gap: clamp(12px, 4vw, 32px);
      align-items: flex-start;
      justify-content: center;
      flex-wrap: wrap;
    }

    .unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      min-width: 68px;
    }

    .unit-value {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.8rem, 9vw, 5.2rem);
      font-weight: 300;
      line-height: 1;
      color: var(--fg);
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 40px rgba(201,168,76,0.22);
      min-width: 2ch;
      display: block;
    }

    .unit-label {
      font-size: 0.62rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold-dim);
      font-weight: 500;
    }

    .unit-sep {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2rem, 6vw, 3.8rem);
      color: var(--divider);
      line-height: 1;
      padding-top: 4px;
      user-select: none;
      align-self: flex-start;
    }

    /* ── done state ── */
    .done-msg {
      display: none;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.6rem, 5vw, 2.8rem);
      font-style: italic;
      color: var(--gold-soft);
      margin-top: 42px;
      text-shadow: 0 0 40px rgba(201,168,76,0.4);
    }

    /* ── bottom ── */
    .bottom-ornament {
      margin-top: 48px;
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      color: var(--gold-dim);
      text-transform: uppercase;
    }

    /* ── shimmer pulse on seconds ── */
    @keyframes pulse-gold {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.7; }
    }
    .unit--seconds .unit-value { animation: pulse-gold 1s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .unit--seconds .unit-value { animation: none; }
    }
  </style>
</head>
<body>
  <canvas id="stars-canvas"></canvas>

  <main class="page">
    <p class="eyebrow">יום החתונה מתקרב</p>

    <h1 class="names">
      שימי
      <span class="ampersand">&amp;</span>
      תמר
    </h1>

    <div class="ornament"><div class="ornament-diamond"></div></div>

    <div class="date-block">
      <p class="date-hebrew">כ״ט חשון תשפ״ז</p>
      <p class="date-secular">09 · 11 · 2026 &nbsp;|&nbsp; 18:00</p>
    </div>

    <div class="countdown" id="countdown">
      <div class="unit" id="unit-days">
        <span class="unit-value" id="days">--</span>
        <span class="unit-label">ימים</span>
      </div>
      <span class="unit-sep">:</span>
      <div class="unit" id="unit-hours">
        <span class="unit-value" id="hours">--</span>
        <span class="unit-label">שעות</span>
      </div>
      <span class="unit-sep">:</span>
      <div class="unit unit--minutes" id="unit-minutes">
        <span class="unit-value" id="minutes">--</span>
        <span class="unit-label">דקות</span>
      </div>
      <span class="unit-sep">:</span>
      <div class="unit unit--seconds" id="unit-seconds">
        <span class="unit-value" id="seconds">--</span>
        <span class="unit-label">שניות</span>
      </div>
    </div>

    <p class="done-msg" id="done-msg">🥂 מזל טוב לשימי ותמר! 🥂</p>

    <p class="bottom-ornament">בשעה טובה ומוצלחת</p>
  </main>

  <script>
    /* ── stars ── */
    (function () {
      const canvas = document.getElementById('stars-canvas');
      const ctx = canvas.getContext('2d');
      let stars = [];
      const N = 220;

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      function init() {
        stars = Array.from({ length: N }, () => ({
          x: Math.random(),
          y: Math.random(),
          r: Math.random() * 1.3 + 0.2,
          base: Math.random() * 0.6 + 0.15,
          speed: Math.random() * 0.6 + 0.2,
          phase: Math.random() * Math.PI * 2,
          gold: Math.random() < 0.08
        }));
      }

      let t = 0;
      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        t += 0.012;
        for (const s of stars) {
          const alpha = s.base + Math.sin(t * s.speed + s.phase) * 0.2;
          ctx.beginPath();
          ctx.arc(s.x * canvas.width, s.y * canvas.height, s.r, 0, Math.PI * 2);
          ctx.fillStyle = s.gold
            ? `rgba(201,168,76,${alpha})`
            : `rgba(232,223,200,${alpha})`;
          ctx.fill();
        }
        requestAnimationFrame(draw);
      }

      resize();
      init();
      draw();
      window.addEventListener('resize', resize);
    })();

    /* ── countdown ── */
    (function () {
      // Wedding: 9 Nov 2026 18:00 Israel time (UTC+2 in Nov, so UTC 16:00)
      const target = new Date('2026-11-09T18:00:00+02:00').getTime();

      const dEl = document.getElementById('days');
      const hEl = document.getElementById('hours');
      const mEl = document.getElementById('minutes');
      const sEl = document.getElementById('seconds');
      const countdown = document.getElementById('countdown');
      const doneMsg  = document.getElementById('done-msg');

      function pad(n) { return String(Math.floor(n)).padStart(2, '0'); }

      function tick() {
        const diff = target - Date.now();
        if (diff <= 0) {
          countdown.style.display = 'none';
          doneMsg.style.display = 'block';
          return;
        }
        const totalSec = diff / 1000;
        const days    = Math.floor(totalSec / 86400);
        const hours   = Math.floor((totalSec % 86400) / 3600);
        const minutes = Math.floor((totalSec % 3600) / 60);
        const seconds = Math.floor(totalSec % 60);

        dEl.textContent = pad(days);
        hEl.textContent = pad(hours);
        mEl.textContent = pad(minutes);
        sEl.textContent = pad(seconds);

        setTimeout(tick, 1000 - (Date.now() % 1000));
      }

      tick();
    })();
  </script>
</body>
</html>
