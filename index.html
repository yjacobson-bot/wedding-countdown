<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>שימי ותמר</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Heebo:wght@300;400;500&display=swap" />
  <style>
    :root {
      --bg:       #080b16;
      --fg:       #ede4cc;
      --muted:    #a09278;
      --gold:     #c9a84c;
      --gold-s:   #e2c97e;
      --gold-d:   #5e4820;
      --div:      rgba(201,168,76,0.28);
      color-scheme: dark;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Heebo', sans-serif;
      font-weight: 300;
      overflow: hidden; /* no scroll */
    }

    /* ── canvas bg ── */
    #bg-canvas {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
    }

    /* ── full-screen page ── */
    .page {
      position: relative; z-index: 1;
      height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      align-items: center;
      justify-items: center;
      padding-inline: max(16px, env(safe-area-inset-right,16px));
      padding-block: calc(env(safe-area-inset-top,0px) + 20px)
                     calc(env(safe-area-inset-bottom,0px) + 16px);
      text-align: center;
    }

    /* ── header area ── */
    .header { display: flex; flex-direction: column; align-items: center; gap: 10px; }

    .eyebrow {
      font-size: clamp(0.55rem, 1.4vw, 0.68rem);
      letter-spacing: 0.26em; text-transform: uppercase; color: var(--gold);
    }

    /* ── names ── */
    .names-row {
      position: relative;
      display: flex; align-items: center; justify-content: center; gap: 0;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.8rem, 10vw, 7rem);
      font-weight: 300; line-height: 1;
      color: var(--fg);
      text-shadow: 0 0 80px rgba(201,168,76,0.18);
    }
    /* side ornaments */
    .names-row .orn { display: flex; align-items: center; }
    .names-row .orn svg { width: clamp(28px,6vw,64px); height: auto; }

    .amp-sep {
      font-family: 'Heebo', sans-serif;
      font-size: 0.5em;
      font-weight: 300;
      color: var(--gold-s);
      margin-inline: 0.18em;
      line-height: 1;
    }

    /* ── ornament divider ── */
    .div-row {
      display: flex; align-items: center; gap: 8px;
      width: min(220px, 65%); margin-top: 6px;
    }
    .div-row::before, .div-row::after {
      content: ''; flex: 1; height: 1px; background: var(--gold-d);
    }
    .diamond { width: 6px; height: 6px; background: var(--gold); transform: rotate(45deg); flex-shrink: 0; }

    .date-he {
      font-family: 'Cormorant Garamond', serif; font-style: italic;
      font-size: clamp(0.78rem, 2vw, 1rem); color: var(--gold-s);
      letter-spacing: 0.05em;
    }
    .date-en {
      font-size: clamp(0.6rem, 1.5vw, 0.68rem);
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted);
    }

    /* ── countdown center ── */
    .countdown-center {
      display: flex; flex-direction: column; align-items: center; gap: clamp(12px,2.5vh,22px);
      width: 100%;
    }

    /* days */
    .days-block { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .days-val {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(5rem, 18vw, 10rem);
      font-weight: 300; line-height: 0.9;
      font-variant-numeric: tabular-nums;
      color: var(--fg);
      text-shadow: 0 0 80px rgba(201,168,76,0.25);
    }
    .days-lbl {
      font-size: clamp(0.65rem, 1.6vw, 0.78rem);
      letter-spacing: 0.28em; text-transform: uppercase; color: var(--gold); font-weight: 500;
    }

    /* row divider */
    .thin-div {
      width: min(200px, 55%); height: 1px; background: var(--div);
    }

    /* hms */
    .hms {
      direction: ltr;
      display: flex; align-items: flex-start; justify-content: center;
      gap: clamp(8px, 3vw, 24px);
    }
    .hms-u { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 50px; }
    .hms-v {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.2rem, 7.5vw, 4.5rem);
      font-weight: 300; line-height: 1;
      font-variant-numeric: tabular-nums;
      color: var(--fg);
    }
    .hms-l {
      font-size: clamp(0.55rem, 1.3vw, 0.65rem);
      letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold-d); font-weight: 500;
      direction: rtl;
    }
    .colon {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.8rem, 6vw, 3.8rem);
      color: var(--div); line-height: 1; padding-top: 2px; user-select: none;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.55} }
    .sec-v { animation: blink 1s ease-in-out infinite; }
    @media (prefers-reduced-motion:reduce) { .sec-v { animation:none } }

    /* done */
    .done { display:none; font-family:'Cormorant Garamond',serif; font-style:italic;
      font-size:clamp(1.5rem,5vw,2.8rem); color:var(--gold-s); }

    /* ── footer ── */
    .footer {
      font-size: clamp(0.55rem, 1.2vw, 0.65rem);
      letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold-d);
    }

    /* ── music button ── */
    #music-btn {
      position: fixed; bottom: calc(env(safe-area-inset-bottom,0px) + 18px); left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(201,168,76,0.12);
      border: 1px solid rgba(201,168,76,0.35);
      color: var(--gold-s);
      font-family: 'Heebo', sans-serif;
      font-size: 0.72rem; letter-spacing: 0.14em;
      padding: 8px 20px; border-radius: 40px; cursor: pointer;
      transition: background 0.3s, opacity 0.3s;
      backdrop-filter: blur(6px);
    }
    #music-btn:hover { background: rgba(201,168,76,0.22); }
    #music-btn.playing { color: var(--gold); }
  </style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<audio id="audio" src="music.mp3" loop preload="none"></audio>

<main class="page">

  <!-- header -->
  <div class="header">
    <p class="eyebrow">יום החתונה מתקרב</p>

    <div class="names-row">
      <!-- left ornament -->
      <span class="orn">
        <svg viewBox="0 0 60 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <g stroke="rgba(201,168,76,0.55)" stroke-width="0.8">
            <line x1="30" y1="0" x2="30" y2="120"/>
            <path d="M30,20 Q15,30 10,50 Q15,70 30,80" fill="none"/>
            <path d="M30,20 Q8,35 6,60 Q8,85 30,100" fill="none" opacity=".5"/>
            <circle cx="30" cy="10" r="2" fill="rgba(201,168,76,0.7)" stroke="none"/>
            <circle cx="30" cy="60" r="1.5" fill="rgba(201,168,76,0.5)" stroke="none"/>
            <path d="M10,50 Q3,55 2,60 Q3,65 10,70" fill="none" opacity=".4"/>
          </g>
        </svg>
      </span>

      שימי<span class="amp-sep">&amp;</span>תמר

      <!-- right ornament (mirrored) -->
      <span class="orn">
        <svg viewBox="0 0 60 120" fill="none" xmlns="http://www.w3.org/2000/svg" style="transform:scaleX(-1)">
          <g stroke="rgba(201,168,76,0.55)" stroke-width="0.8">
            <line x1="30" y1="0" x2="30" y2="120"/>
            <path d="M30,20 Q15,30 10,50 Q15,70 30,80" fill="none"/>
            <path d="M30,20 Q8,35 6,60 Q8,85 30,100" fill="none" opacity=".5"/>
            <circle cx="30" cy="10" r="2" fill="rgba(201,168,76,0.7)" stroke="none"/>
            <circle cx="30" cy="60" r="1.5" fill="rgba(201,168,76,0.5)" stroke="none"/>
            <path d="M10,50 Q3,55 2,60 Q3,65 10,70" fill="none" opacity=".4"/>
          </g>
        </svg>
      </span>
    </div>

    <div class="div-row"><div class="diamond"></div></div>
    <p class="date-he">כ״ט חשון תשפ״ז</p>
    <p class="date-en">09 · 11 · 2026 &nbsp;|&nbsp; 18:00</p>
  </div>

  <!-- countdown -->
  <div class="countdown-center" id="cw">
    <div class="days-block">
      <span class="days-val" id="days">--</span>
      <span class="days-lbl">ימים</span>
    </div>
    <div class="thin-div"></div>
    <div class="hms">
      <div class="hms-u">
        <span class="hms-v" id="hours">--</span>
        <span class="hms-l">שעות</span>
      </div>
      <span class="colon">:</span>
      <div class="hms-u">
        <span class="hms-v" id="minutes">--</span>
        <span class="hms-l">דקות</span>
      </div>
      <span class="colon">:</span>
      <div class="hms-u">
        <span class="hms-v sec-v" id="seconds">--</span>
        <span class="hms-l">שניות</span>
      </div>
    </div>
    <p class="done" id="done">🥂 מזל טוב לשימי ותמר! 🥂</p>
  </div>

  <!-- footer -->
  <p class="footer">בשעה טובה ומוצלחת</p>
</main>

<!-- music toggle -->
<button id="music-btn" onclick="toggleMusic()">♪ נגן מוזיקה</button>

<script>
/* ════ BACKGROUND ════ */
(function(){
  const c=document.getElementById('bg-canvas'), ctx=c.getContext('2d');
  let stars=[], orbs=[];
  function resize(){ c.width=innerWidth; c.height=innerHeight; }
  function init(){
    stars=Array.from({length:220},()=>({
      x:Math.random(),y:Math.random(),r:Math.random()*1.2+0.2,
      base:Math.random()*0.5+0.1,speed:Math.random()*0.5+0.2,
      phase:Math.random()*Math.PI*2,gold:Math.random()<0.07
    }));
    orbs=Array.from({length:6},(_,i)=>({
      x:Math.random(),y:Math.random(),
      vx:(Math.random()-.5)*0.00012,vy:(Math.random()-.5)*0.00012,
      r:Math.random()*0.16+0.07,
      alpha:Math.random()*0.055+0.015,
      gold:i%2===0
    }));
  }
  let t=0;
  function draw(){
    const W=c.width,H=c.height;
    ctx.clearRect(0,0,W,H);
    t+=0.011;
    for(const o of orbs){
      o.x+=o.vx; o.y+=o.vy;
      if(o.x<-.2)o.x=1.2; if(o.x>1.2)o.x=-.2;
      if(o.y<-.2)o.y=1.2; if(o.y>1.2)o.y=-.2;
      const g=ctx.createRadialGradient(o.x*W,o.y*H,0,o.x*W,o.y*H,o.r*Math.min(W,H));
      const col=o.gold?'201,168,76':'160,130,255';
      g.addColorStop(0,`rgba(${col},${o.alpha})`);
      g.addColorStop(1,`rgba(${col},0)`);
      ctx.beginPath();ctx.arc(o.x*W,o.y*H,o.r*Math.min(W,H),0,Math.PI*2);
      ctx.fillStyle=g;ctx.fill();
    }
    for(const s of stars){
      const a=s.base+Math.sin(t*s.speed+s.phase)*0.18;
      ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);
      ctx.fillStyle=s.gold?`rgba(201,168,76,${a})`:`rgba(232,223,200,${a})`;
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  resize();init();draw();
  addEventListener('resize',resize);
})();

/* ════ COUNTDOWN ════ */
(function(){
  const target=new Date('2026-11-09T18:00:00+02:00').getTime();
  const dE=document.getElementById('days'),
        hE=document.getElementById('hours'),
        mE=document.getElementById('minutes'),
        sE=document.getElementById('seconds'),
        doneEl=document.getElementById('done');
  function pad(n){return String(Math.floor(n)).padStart(2,'0');}
  function tick(){
    const diff=target-Date.now();
    if(diff<=0){
      document.querySelector('.days-block').style.display='none';
      document.querySelector('.thin-div').style.display='none';
      document.querySelector('.hms').style.display='none';
      doneEl.style.display='block';
      return;
    }
    const s=diff/1000;
    dE.textContent=Math.floor(s/86400);
    hE.textContent=pad((s%86400)/3600);
    mE.textContent=pad((s%3600)/60);
    sE.textContent=pad(s%60);
    setTimeout(tick,1000-(Date.now()%1000));
  }
  tick();
})();

/* ════ MUSIC ════ */
const audio=document.getElementById('audio');
const btn=document.getElementById('music-btn');
let playing=false;
function toggleMusic(){
  if(!playing){
    audio.play().then(()=>{
      playing=true;
      btn.textContent='♪ עצור מוזיקה';
      btn.classList.add('playing');
    }).catch(()=>{});
  } else {
    audio.pause();
    playing=false;
    btn.textContent='♪ נגן מוזיקה';
    btn.classList.remove('playing');
  }
}
</script>
</body>
</html>
