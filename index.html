<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>שימי ותמר</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Frank+Ruhl+Libre:wght@300;400;500&family=Heebo:wght@300;400;500&display=swap" />
  <style>
    :root {
      --bg:    #080b16;
      --fg:    #ede4cc;
      --muted: #a09278;
      --gold:  #c9a84c;
      --golds: #e2c97e;
      --goldd: #5e4820;
      --div:   rgba(201,168,76,0.3);
      color-scheme: dark;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%; overflow: hidden;
      background: var(--bg); color: var(--fg);
      font-family: 'Heebo', sans-serif; font-weight: 300;
    }

    #bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

    .page {
      position: relative; z-index: 1;
      height: 100dvh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: space-evenly;
      gap: 0;
      padding-inline: max(20px, 4vw);
      padding-block: calc(env(safe-area-inset-top,0px) + 4px)
                     calc(env(safe-area-inset-bottom,0px) + 6px);
      text-align: center;
      overflow: hidden;
    }
    @media (prefers-reduced-motion:reduce) { .names::after { animation: none; } }

    .amp {
      font-family: 'Heebo', sans-serif; font-size: 0.45em;
      background: none; -webkit-text-fill-color: var(--golds);
      vertical-align: middle; margin-inline: 0.2em;
    }

    .name-btn { transition: filter 0.6s ease, opacity 0.6s ease; }
    .name-btn.inactive { opacity: 0.35; filter: none; }
    .name-btn.active {
      filter:
        drop-shadow(0 0 12px rgba(201,168,76,0.95))
        drop-shadow(0 0 30px rgba(201,168,76,0.7))
        drop-shadow(0 0 60px rgba(201,168,76,0.45))
        drop-shadow(0 0 100px rgba(201,168,76,0.25));
    }

    /* breathing names */
    @keyframes breathe {
      0%,100% { opacity: 0.85; transform: scale(1);    filter: brightness(1);   }
      50%      { opacity: 1;    transform: scale(1.025); filter: brightness(1.15); }
    }
    .names {
      animation: breathe 4s ease-in-out infinite;
      position: relative; overflow: hidden;
      font-family: 'Frank Ruhl Libre','Cormorant Garamond',serif;
      font-size: min(14vw, 17vh);
      font-weight: 400; line-height: 1; white-space: nowrap;
    }
    @media (prefers-reduced-motion:reduce) { .names { animation: none; } }

    /* gold shimmer sweep — two beams, animated independently by JS */
    .shimmer-beam {
      position: absolute;
      top: -10%; width: 55%; height: 120%;
      background: linear-gradient(
        105deg,
        transparent 30%,
        rgba(255,240,160,0.65) 50%,
        transparent 70%
      );
      pointer-events: none; opacity: 0;
    }
    .shimmer-beam.ltr { transform: skewX(-15deg); }
    .shimmer-beam.rtl { transform: skewX(15deg) scaleX(-1); }
    @media (prefers-reduced-motion:reduce) { .shimmer-beam { display:none; } }

    /* amp spark container */
    .amp-wrap { position: relative; display: inline-block; vertical-align: middle; }
    .spark {
      position: absolute;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--golds);
      pointer-events: none;
      opacity: 0;
    }

    /* נותרו label */
    .notaru {
      font-family: 'Cormorant Garamond', serif; font-style: italic;
      font-size: clamp(1.1rem, 3.5vw, 2.2rem);
      color: var(--golds); letter-spacing: 0.18em;
      margin-bottom: -0.1em;
      text-shadow: 0 0 30px rgba(201,168,76,0.5);
      line-height: 1;
    }

    .orndiv {
      display: flex; align-items: center; gap: 8px;
      width: min(200px, 40vw);
    }
    .orndiv::before, .orndiv::after { content:''; flex:1; height:1px; background:var(--goldd); }
    .dia { width:5px; height:5px; background:var(--gold); transform:rotate(45deg); flex-shrink:0; }

    .dates { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .date-he {
      font-family:'Cormorant Garamond',serif; font-style:italic;
      font-size: clamp(0.75rem, 1.6vw, 1.1rem); color: var(--golds); letter-spacing: 0.05em;
    }
    .date-en {
      font-size: clamp(0.55rem, 1vw, 0.72rem);
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted);
    }

    .middle {
      display: flex; align-items: center; justify-content: center; gap: 3vw;
      width: 100%;
    }

    .orn-side svg {
      height: min(13vh, 100px); width: auto; opacity: 0.5;
      transition: opacity 0.1s;
    }
    .orn-side.flip { transform: scaleX(-1); }

    .days-block { display: flex; flex-direction: column; align-items: center; gap: 0; }
    .days-val {
      font-family: 'Cormorant Garamond', serif; font-weight: 300;
      font-size: min(18vw, 22vh);
      line-height: 0.9; font-variant-numeric: tabular-nums; color: var(--fg);
      text-shadow: 0 0 120px rgba(201,168,76,0.25);
      display: inline-block;
      transition: transform 0.05s;
    }
    .days-lbl {
      font-size: clamp(0.6rem, 1.4vw, 0.85rem);
      letter-spacing: 0.32em; text-transform: uppercase; color: var(--gold); font-weight: 500;
    }

    .bottom { display: flex; flex-direction: column; align-items: center; gap: 0.8vh; }
    .thin-div { width: min(180px, 35vw); height: 1px; background: var(--div); }

    .hms {
      direction: ltr;
      display: flex; align-items: flex-start; justify-content: center;
      gap: clamp(6px, 2.5vw, 24px);
    }
    .hms-u { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 3ch; }
    .hms-v {
      font-family: 'Cormorant Garamond', serif; font-weight: 300;
      font-size: min(7.5vw, 10vh);
      line-height: 1; font-variant-numeric: tabular-nums; color: var(--fg);
    }
    .hms-l {
      font-size: clamp(0.5rem, 0.9vw, 0.65rem);
      letter-spacing: 0.2em; text-transform: uppercase; color: var(--goldd); direction: rtl;
    }
    .colon {
      font-family: 'Cormorant Garamond', serif;
      font-size: min(6vw, 8.5vh);
      color: var(--div); line-height: 1; padding-top: 1px; user-select: none;
    }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.5} }
    .sec-v { animation: blink 1s ease-in-out infinite; }
    @media (prefers-reduced-motion:reduce) { .sec-v { animation:none } }

    .done { display:none; font-family:'Cormorant Garamond',serif; font-style:italic;
      font-size:min(5vw,7vh); color:var(--golds); }

    .footer {
      font-size: clamp(0.5rem, 0.9vw, 0.65rem);
      letter-spacing: 0.22em; text-transform: uppercase; color: var(--goldd);
    }
  </style>
</head>
<body>
<canvas id="bg-canvas"></canvas>

<audio id="ag1" src="music.mp3"        preload="none" crossorigin="anonymous"></audio>
<audio id="ag2" src="music2.mp3"       preload="none" crossorigin="anonymous"></audio>
<audio id="ag3" src="music3.mp3"       preload="none" crossorigin="anonymous"></audio>
<audio id="ag4" src="music4.mp3"       preload="none" crossorigin="anonymous"></audio>
<audio id="ag5" src="music5.mp3"       preload="none" crossorigin="anonymous"></audio>
<audio id="ab1" src="music_bride.mp3"  preload="none" crossorigin="anonymous"></audio>
<audio id="ab2" src="music2_bride.mp3" preload="none" crossorigin="anonymous"></audio>
<audio id="ab3" src="music3_bride.mp3" preload="none" crossorigin="anonymous"></audio>
<audio id="ab4" src="music4_bride.mp3" preload="none" crossorigin="anonymous"></audio>
<audio id="ab5" src="music5_bride.mp3" preload="none" crossorigin="anonymous"></audio>

<!-- splash -->
<div id="splash" style="
  position:fixed;inset:0;z-index:100;background:#080b16;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2.5vh;cursor:pointer;transition:opacity 0.9s ease;overflow:hidden;
">
  <div style="
    position:absolute;inset:0;
    background:url('invitation.png') center/cover no-repeat;
    filter:blur(4px) brightness(0.45) saturate(0.8);
    transform:scale(1.08);z-index:0;
  "></div>
  <div style="position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:3vh;">
    <p style="font-family:'Heebo',sans-serif;font-size:clamp(0.55rem,1.1vw,0.72rem);
      letter-spacing:0.3em;text-transform:uppercase;color:#c9a84c;">
      לחצו על השם שלכם
    </p>
    <div style="display:flex;align-items:center;direction:rtl;">
      <span id="btn-groom" style="
        font-family:'Frank Ruhl Libre','Cormorant Garamond',serif;font-weight:400;
        font-size:clamp(3rem,12vw,9rem);line-height:1;
        background:linear-gradient(160deg,#f5eedd 10%,#f0d98a 40%,#c9a84c 60%,#f0d98a 75%,#f5eedd 95%);
        -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
        cursor:pointer;transition:filter 0.2s;
        filter:drop-shadow(0 0 30px rgba(201,168,76,0.6)) drop-shadow(0 2px 20px rgba(0,0,0,0.9));user-select:none;
      ">שימי</span>
      <span style="font-family:'Heebo',sans-serif;font-size:clamp(1.2rem,4vw,3.5rem);
        color:#c9a84c;margin-inline:0.15em;line-height:1;">&amp;</span>
      <span id="btn-bride" style="
        font-family:'Frank Ruhl Libre','Cormorant Garamond',serif;font-weight:400;
        font-size:clamp(3rem,12vw,9rem);line-height:1;
        background:linear-gradient(160deg,#f5eedd 10%,#f0d98a 40%,#c9a84c 60%,#f0d98a 75%,#f5eedd 95%);
        -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
        cursor:pointer;transition:filter 0.2s;
        filter:drop-shadow(0 0 30px rgba(201,168,76,0.6)) drop-shadow(0 2px 20px rgba(0,0,0,0.9));user-select:none;
      ">תמר</span>
    </div>
    <p style="font-family:'Cormorant Garamond',serif;font-style:italic;
      font-size:clamp(0.85rem,1.8vw,1.2rem);color:#e2c97e;
      text-shadow:0 1px 12px rgba(0,0,0,0.7);">
      כמה זמן נשאר לחתונה?
    </p>
    <div style="width:6px;height:6px;background:#c9a84c;
      transform:rotate(45deg);animation:pulse2 1.4s ease-in-out infinite;"></div>
  </div>
</div>

<style>
@keyframes pulse2{0%,100%{opacity:1;transform:rotate(45deg) scale(1)}
  50%{opacity:0.4;transform:rotate(45deg) scale(1.6)}}
</style>

<main class="page">
  <div class="top">
    <div class="names-frame">
      <div class="orn-line">✦ ◆ ✦</div>
      <h1 class="names">
        <span class="shimmer-beam ltr" id="beam-ltr"></span>
        <span class="shimmer-beam rtl" id="beam-rtl"></span>
        <span id="main-groom" class="name-btn">שימי</span><span class="amp-wrap"><span class="amp" id="amp-el">&amp;</span></span><span id="main-bride" class="name-btn">תמר</span>
      </h1>
      <div class="orn-line">✦ ◆ ✦</div>
    </div>
  </div>

  <div class="dates">
    <div class="orndiv"><div class="dia"></div></div>
    <p class="date-he">כ״ט חשון תשפ״ז</p>
    <p class="date-en">09 · 11 · 2026 &nbsp;|&nbsp; 18:00</p>
  </div>

  <div class="middle">
    <span class="orn-side" id="orn-left">
      <svg viewBox="0 0 30 160" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g stroke="rgba(201,168,76,1)" stroke-width="0.7">
          <line x1="15" y1="0" x2="15" y2="160"/>
          <path d="M15,25 Q4,50 3,80 Q4,110 15,135" fill="none"/>
          <path d="M15,40 Q1,65 0,80 Q1,95 15,120" fill="none" opacity=".45"/>
          <circle cx="15" cy="12" r="2" fill="rgba(201,168,76,.9)" stroke="none"/>
          <circle cx="15" cy="80" r="1.5" fill="rgba(201,168,76,.6)" stroke="none"/>
          <circle cx="15" cy="148" r="2" fill="rgba(201,168,76,.9)" stroke="none"/>
        </g>
      </svg>
    </span>

    <div class="days-block">
      <p class="notaru">נותרו</p>
      <span class="days-val" id="days">--</span>
      <span class="days-lbl">ימים</span>
    </div>

    <span class="orn-side flip" id="orn-right">
      <svg viewBox="0 0 30 160" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g stroke="rgba(201,168,76,1)" stroke-width="0.7">
          <line x1="15" y1="0" x2="15" y2="160"/>
          <path d="M15,25 Q4,50 3,80 Q4,110 15,135" fill="none"/>
          <path d="M15,40 Q1,65 0,80 Q1,95 15,120" fill="none" opacity=".45"/>
          <circle cx="15" cy="12" r="2" fill="rgba(201,168,76,.9)" stroke="none"/>
          <circle cx="15" cy="80" r="1.5" fill="rgba(201,168,76,.6)" stroke="none"/>
          <circle cx="15" cy="148" r="2" fill="rgba(201,168,76,.9)" stroke="none"/>
        </g>
      </svg>
    </span>
  </div>

  <div class="bottom">
    <div class="thin-div"></div>
    <div class="hms" id="hms">
      <div class="hms-u">
        <span class="hms-v" id="hours">--</span>
        <span class="hms-l">שעות</span>
      </div>
      <span class="colon">:</span>
      <div class="hms-u">
        <span class="hms-v" id="minutes">--</span>
        <span class="hms-l">דקות</span>
      </div>
      <span class="colon">:</span>
      <div class="hms-u">
        <span class="hms-v sec-v" id="seconds">--</span>
        <span class="hms-l">שניות</span>
      </div>
    </div>
    <p class="done" id="done">🥂 מזל טוב לשימי ותמר! 🥂</p>
  </div>

  <p class="footer">בשעה טובה ומוצלחת</p>
</main>

<script>
/* ══════════════════════════════════════════
   SHARED BEAT STATE
══════════════════════════════════════════ */
let beatEnergy = 0; // 0-1, updated by audio engine

/* ══════════════════════════════════════════
   CANVAS — stars, meteors, falling ornaments
══════════════════════════════════════════ */
(function(){
  const c   = document.getElementById('bg-canvas');
  const ctx = c.getContext('2d');

  function resize(){ c.width=innerWidth; c.height=innerHeight; }

  /* ── static stars ── */
  let stars = [];
  function initStars(){
    stars = Array.from({length:230}, () => ({
      x:Math.random(), y:Math.random(),
      r:Math.random()*1.3+0.2,
      base:Math.random()*0.5+0.1,
      speed:Math.random()*0.5+0.2,
      phase:Math.random()*Math.PI*2,
      gold:Math.random()<0.07
    }));
  }

  /* ── drifting orbs ── */
  let orbs = [];
  function initOrbs(){
    orbs = Array.from({length:6},(_,i)=>({
      x:Math.random(), y:Math.random(),
      vx:(Math.random()-.5)*0.00011, vy:(Math.random()-.5)*0.00011,
      r:Math.random()*0.16+0.07, alpha:Math.random()*0.05+0.015,
      gold:i%2===0
    }));
  }

  /* ── shooting stars ── */
  let meteors = [];
  function spawnMeteor(m){
    const fromLeft = m.side==='left';
    const angle = (Math.random()*25+10)*Math.PI/180;
    m.speed = Math.random()*7+5;
    m.vx = fromLeft ?  Math.cos(angle)*m.speed : -Math.cos(angle)*m.speed;
    m.vy = Math.sin(angle)*m.speed;
    m.x  = fromLeft ? Math.random()*c.width*0.2 : c.width*0.8+Math.random()*c.width*0.2;
    m.y  = Math.random()*c.height*0.55;
    m.maxLife = Math.random()*45+35;
    m.life = m.maxLife;
    m.active = true;
  }
  function initMeteors(){
    meteors = Array.from({length:14},(_,i)=>({
      active:false, timer:Math.random()*120+20, side:i<7?'left':'right'
    }));
  }

  /* ── falling ornaments ── */
  const ORN_COUNT = 28;
  let orns = [];
  function initOrns(){
    orns = Array.from({length:ORN_COUNT}, () => makeOrn(true));
  }
  function makeOrn(randomY){
    const type = Math.random() < 0.5 ? 'diamond' : (Math.random()<0.5 ? 'sparkle' : 'ring');
    return {
      x      : Math.random(),
      y      : randomY ? Math.random() : -0.05,
      size   : Math.random()*5+3,
      speed  : Math.random()*0.0008+0.0003,
      drift  : (Math.random()-.5)*0.0003,
      driftF : Math.random()*0.8+0.3,
      driftP : Math.random()*Math.PI*2,
      rot    : Math.random()*Math.PI,
      rotV   : (Math.random()-.5)*0.03,
      alpha  : Math.random()*0.5+0.25,
      gold   : Math.random()<0.75,
      type
    };
  }

  function drawDiamond(x,y,s,rot,alpha,gold){
    ctx.save();
    ctx.translate(x,y); ctx.rotate(rot);
    const col = gold ? `rgba(201,168,76,${alpha})` : `rgba(232,220,180,${alpha})`;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(0,-s); ctx.lineTo(s*0.55,0); ctx.lineTo(0,s); ctx.lineTo(-s*0.55,0);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawSparkle(x,y,s,rot,alpha,gold){
    ctx.save();
    ctx.translate(x,y); ctx.rotate(rot);
    const col = gold ? `rgba(225,195,100,${alpha})` : `rgba(240,230,200,${alpha})`;
    ctx.strokeStyle = col; ctx.lineWidth = 0.8;
    for(let i=0;i<4;i++){
      ctx.rotate(Math.PI/4);
      ctx.beginPath();
      ctx.moveTo(0,-s*1.4); ctx.lineTo(0,-s*0.3);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawRing(x,y,s,alpha,gold){
    ctx.beginPath();
    ctx.arc(x,y,s,0,Math.PI*2);
    const col = gold ? `rgba(201,168,76,${alpha*0.7})` : `rgba(230,215,170,${alpha*0.7})`;
    ctx.strokeStyle = col; ctx.lineWidth = 0.7;
    ctx.stroke();
  }

  let t = 0;
  function draw(){
    const W=c.width, H=c.height;
    ctx.clearRect(0,0,W,H);
    t += 0.011;

    const beat = beatEnergy; // 0-1

    /* orbs */
    for(const o of orbs){
      o.x+=o.vx; o.y+=o.vy;
      if(o.x<-.2)o.x=1.2; if(o.x>1.2)o.x=-.2;
      if(o.y<-.2)o.y=1.2; if(o.y>1.2)o.y=-.2;
      const g=ctx.createRadialGradient(o.x*W,o.y*H,0,o.x*W,o.y*H,o.r*Math.min(W,H));
      const col=o.gold?'201,168,76':'150,120,255';
      const a = o.alpha*(1+beat*0.6);
      g.addColorStop(0,`rgba(${col},${a})`); g.addColorStop(1,`rgba(${col},0)`);
      ctx.beginPath(); ctx.arc(o.x*W,o.y*H,o.r*Math.min(W,H)*(1+beat*0.15),0,Math.PI*2);
      ctx.fillStyle=g; ctx.fill();
    }

    /* stars — pulse strongly on beat */
    for(const s of stars){
      const twinkle = Math.sin(t*s.speed+s.phase)*0.18;
      const a = Math.min(1, s.base + twinkle + beat*0.55);
      const r = s.r * (1 + beat*1.1);
      ctx.beginPath(); ctx.arc(s.x*W, s.y*H, r, 0, Math.PI*2);
      ctx.fillStyle = s.gold?`rgba(201,168,76,${a})`:`rgba(232,223,200,${a})`;
      ctx.fill();
      /* extra glow halo on strong beats */
      if(beat > 0.35){
        ctx.beginPath(); ctx.arc(s.x*W, s.y*H, r*3.5, 0, Math.PI*2);
        const gc = ctx.createRadialGradient(s.x*W,s.y*H,r,s.x*W,s.y*H,r*3.5);
        const col = s.gold ? '201,168,76' : '232,223,200';
        gc.addColorStop(0,`rgba(${col},${beat*0.25})`);
        gc.addColorStop(1,`rgba(${col},0)`);
        ctx.fillStyle = gc; ctx.fill();
      }
    }

    /* shooting stars */
    for(const m of meteors){
      if(!m.active){ m.timer--; if(m.timer<=0) spawnMeteor(m); continue; }
      m.x+=m.vx; m.y+=m.vy; m.life--;
      const prog=1-m.life/m.maxLife;
      const alpha=prog<0.2?prog/0.2:(prog>0.8?(1-prog)/0.2:1);
      const tailLen=m.speed*18;
      const gm=ctx.createLinearGradient(m.x,m.y,m.x-m.vx*tailLen/m.speed,m.y-m.vy*tailLen/m.speed);
      gm.addColorStop(0,`rgba(255,240,180,${0.9*alpha})`);
      gm.addColorStop(1,'rgba(201,168,76,0)');
      ctx.beginPath(); ctx.moveTo(m.x,m.y);
      ctx.lineTo(m.x-m.vx*tailLen/m.speed,m.y-m.vy*tailLen/m.speed);
      ctx.strokeStyle=gm; ctx.lineWidth=1.5; ctx.stroke();
      const gh=ctx.createRadialGradient(m.x,m.y,0,m.x,m.y,4);
      gh.addColorStop(0,`rgba(255,248,200,${0.8*alpha})`); gh.addColorStop(1,'rgba(255,248,200,0)');
      ctx.beginPath(); ctx.arc(m.x,m.y,4,0,Math.PI*2); ctx.fillStyle=gh; ctx.fill();
      if(m.life<=0){ m.active=false; m.timer=Math.random()*180+80; }
    }

    /* falling ornaments — beat makes them shimmer */
    for(const o of orns){
      o.y += o.speed * (1 + beat*1.2);
      o.x += Math.sin(t*o.driftF+o.driftP)*o.drift;
      o.rot += o.rotV;
      const edgeFade = Math.min(o.y*8, (1-o.y)*8, 1);
      const a = o.alpha * edgeFade * (1 + beat*0.5);
      const px = ((o.x%1+1)%1)*W, py = o.y*H;
      if(o.type==='diamond')  drawDiamond(px,py,o.size,o.rot,a,o.gold);
      else if(o.type==='sparkle') drawSparkle(px,py,o.size,o.rot,a,o.gold);
      else                    drawRing(px,py,o.size,a,o.gold);
      if(o.y>1.05) Object.assign(o, makeOrn(false));
    }

    requestAnimationFrame(draw);
  }

  resize(); initStars(); initOrbs(); initMeteors(); initOrns();
  draw();
  addEventListener('resize', resize);
})();

══════════════════════════════════════════ */
(function(){
  const target = new Date('2026-11-09T18:00:00+02:00').getTime();
  const dE=document.getElementById('days'),
        hE=document.getElementById('hours'),
        mE=document.getElementById('minutes'),
        sE=document.getElementById('seconds'),
        doneEl=document.getElementById('done');
  function pad(n){ return String(Math.floor(n)).padStart(2,'0'); }
  function tick(){
    const diff = target-Date.now();
    if(diff<=0){
      document.querySelector('.days-block').style.display='none';
      document.querySelector('.thin-div').style.display='none';
      document.getElementById('hms').style.display='none';
      doneEl.style.display='block'; return;
    }
    const s=diff/1000;
    dE.textContent=Math.floor(s/86400);
    hE.textContent=pad((s%86400)/3600);
    mE.textContent=pad((s%3600)/60);
    sE.textContent=pad(s%60);
    setTimeout(tick, 1000-(Date.now()%1000));
  }
  tick();
})();

/* ══════════════════════════════════════════
   BEAT-SYNC DOM PULSE
══════════════════════════════════════════ */
(function(){
  const daysEl    = document.getElementById('days');
  const ornLeft   = document.getElementById('orn-left');
  const ornRight  = document.getElementById('orn-right');
  let smoothBeat  = 0;
  let lastBeat    = 0;
  const THRESH    = 0.45;

  function pulse(){
    smoothBeat += (beatEnergy - smoothBeat) * 0.25;
    const s = 1 + smoothBeat * 0.09;
    daysEl.style.transform   = `scale(${s})`;
    daysEl.style.textShadow  = `0 0 ${120+smoothBeat*120}px rgba(201,168,76,${0.25+smoothBeat*0.6})`;
    ornLeft.style.opacity    = 0.4 + smoothBeat*0.6;
    ornRight.style.opacity   = 0.4 + smoothBeat*0.6;
    lastBeat = smoothBeat;
    requestAnimationFrame(pulse);
  }
  pulse();
})();

/* ══════════════════════════════════════════
   AUDIO ENGINE — Web Audio API + crossfade
══════════════════════════════════════════ */
(function(){
  const GROOM_IDS = ['ag1','ag2','ag3','ag4','ag5'];
  const BRIDE_IDS = ['ab1','ab2','ab3','ab4','ab5'];
  const FADE_DUR  = 3.0; // seconds crossfade

  let audioCtx, analyser, freqData;
  const nodes = {}; // id -> { audio, gain, _check, _ended }
  let activeIds = null;
  let currentId = null;

  function initCtx(){
    if(audioCtx) return;
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.55;
    freqData = new Uint8Array(analyser.frequencyBinCount);
    analyser.connect(audioCtx.destination);

    [...GROOM_IDS,...BRIDE_IDS].forEach(id => {
      const audio = document.getElementById(id);
      try {
        const src  = audioCtx.createMediaElementSource(audio);
        const gain = audioCtx.createGain();
        gain.gain.value = 0;
        src.connect(gain);
        gain.connect(analyser);
        nodes[id] = { audio, gain, _check:null, _ended:null };
      } catch(e){ nodes[id] = { audio, gain:null, _check:null, _ended:null }; }
    });

    /* beat detection loop — use peak of bass bins, amplified */
    (function beatLoop(){
      if(analyser){
        analyser.getByteFrequencyData(freqData);
        let peak = 0;
        for(let i=0;i<16;i++) if(freqData[i]>peak) peak=freqData[i];
        // amplify: map 0-255 → 0-1 then boost so typical beat ~0.4-0.8
        beatEnergy = Math.min(1, (peak/255) * 2.2);
      }
      setTimeout(beatLoop, 20);
    })();
  }

  function pickRandom(ids, exclude){
    const pool = ids.length>1 ? ids.filter(x=>x!==exclude) : ids;
    return pool[Math.floor(Math.random()*pool.length)];
  }

  function clearListeners(node){
    if(node._check)  { node.audio.removeEventListener('timeupdate', node._check); node._check=null; }
    if(node._ended)  { node.audio.removeEventListener('ended',      node._ended); node._ended=null; }
  }

  function crossfadeTo(nextId, startAt){
    const now  = audioCtx.currentTime;
    const next = nodes[nextId];
    if(!next) return;

    /* fade out & schedule cleanup of current */
    if(currentId && currentId !== nextId){
      const cur = nodes[currentId];
      clearListeners(cur);
      if(cur.gain){
        const g = cur.gain.gain;
        g.cancelScheduledValues(now);
        g.setValueAtTime(g.value, now);
        g.linearRampToValueAtTime(0, now + FADE_DUR);
      }
      const prevId = currentId;
      setTimeout(()=>{
        const p = nodes[prevId];
        p.audio.pause(); p.audio.currentTime = 0;
      }, (FADE_DUR + 0.3) * 1000);
    }

    /* fade in next */
    next.audio.currentTime = startAt || 0;
    next.audio.play().catch(()=>{});
    if(next.gain){
      const g = next.gain.gain;
      g.cancelScheduledValues(now);
      g.setValueAtTime(0, now);
      g.linearRampToValueAtTime(0.85, now + FADE_DUR);
    }

    currentId = nextId;

    /* start crossfade FADE_DUR seconds BEFORE song ends */
    let fading = false;
    next._check = function(){
      if(fading || !next.audio.duration) return;
      const remaining = next.audio.duration - next.audio.currentTime;
      if(remaining > 0 && remaining <= FADE_DUR + 0.15){
        fading = true;
        clearListeners(next);
        if(currentId === nextId && activeIds)
          crossfadeTo(pickRandom(activeIds, nextId));
      }
    };
    next._ended = function(){
      if(currentId === nextId && activeIds)
        crossfadeTo(pickRandom(activeIds, nextId));
    };
    next.audio.addEventListener('timeupdate', next._check);
    next.audio.addEventListener('ended',      next._ended, {once:true});
  }

  // ── persist playback position ──
  function savePos(who){
    if(!currentId) return;
    const audio = nodes[currentId]?.audio;
    if(!audio || !audio.currentTime) return;
    try { localStorage.setItem('wc_'+who, JSON.stringify({id:currentId, t:audio.currentTime})); } catch(e){}
  }
  function loadPos(who){ try { return JSON.parse(localStorage.getItem('wc_'+who)||'null'); } catch(e){ return null; } }

  function startPlaylist(ids, who){
    activeIds = ids;
    const saved = who ? loadPos(who) : null;
    if(saved && ids.includes(saved.id) && saved.t > 5){
      crossfadeTo(saved.id, saved.t);
    } else {
      crossfadeTo(pickRandom(ids, null));
    }
    // save position every 5s
    if(who) setInterval(()=>savePos(who), 5000);
  }

  /* ── main-page name entrance animation (fires once after splash) ── */
  function animateMainNames(){
    const GRAD = 'linear-gradient(160deg,#f5eedd 10%,#f0d98a 40%,#c9a84c 60%,#f0d98a 75%,#f5eedd 95%)';
    const W = window.innerWidth;
    let idx = 0;

    [document.getElementById('main-groom'), document.getElementById('main-bride')].forEach((el, ei) => {
      if(!el) return;
      const text = el.textContent;
      el.textContent = '';

      [...text].forEach((ch, i) => {
        const sp = document.createElement('span');
        sp.textContent = ch;
        /* fly in from random side of screen */
        const fromLeft = Math.random() > 0.5;
        const tx = fromLeft ? -(Math.random()*0.35 + 0.55)*W : (Math.random()*0.35 + 0.55)*W;
        const ty = (Math.random() - 0.5) * 90;
        const rot = (Math.random() - 0.5) * 28;
        sp.style.cssText = `
          display:inline-block;
          background:${GRAD};
          -webkit-background-clip:text;background-clip:text;
          -webkit-text-fill-color:transparent;
          opacity:0;
          transform:translateX(${tx}px) translateY(${ty}px) rotate(${rot}deg) scale(0.5);
        `;
        sp.dataset.li = idx++;
        el.appendChild(sp);
      });
    });

    /* force reflow so initial state is painted, then add transitions */
    document.body.offsetHeight;
    setTimeout(() => {
      document.querySelectorAll('#main-groom span[data-li], #main-bride span[data-li]').forEach(sp => {
        const d = +sp.dataset.li * 0.08;
        sp.style.transition = `transform 0.9s cubic-bezier(.2,.8,.2,1.05) ${d}s, opacity 0.55s ease ${d}s`;
        sp.style.opacity    = '1';
        sp.style.transform  = 'translateX(0) translateY(0) rotate(0deg) scale(1)';
      });
    }, 30);
  }

  /* ── splash UI ── */
  const splash    = document.getElementById('splash');
  const btnGroom  = document.getElementById('btn-groom');
  const btnBride  = document.getElementById('btn-bride');
  const mainGroom = document.getElementById('main-groom');
  const mainBride = document.getElementById('main-bride');

  [btnGroom,btnBride].forEach(btn=>{
    btn.addEventListener('mouseenter',()=>{
      btn.style.filter='drop-shadow(0 0 20px rgba(201,168,76,0.8)) drop-shadow(0 2px 20px rgba(0,0,0,0.9))';
    });
    btn.addEventListener('mouseleave',()=>{
      btn.style.filter='drop-shadow(0 2px 20px rgba(0,0,0,0.9))';
    });
  });

  let currentSide = null;

  function setSide(who){
    mainGroom.classList.toggle('active',   who==='groom');
    mainGroom.classList.toggle('inactive', who==='bride');
    mainBride.classList.toggle('active',   who==='bride');
    mainBride.classList.toggle('inactive', who==='groom');
    currentSide = who;
  }

  function switchSide(who){
    if(!audioCtx || currentSide === who) return;
    setSide(who);
    // crossfade to new playlist immediately
    const newIds = who==='groom' ? GROOM_IDS : BRIDE_IDS;
    activeIds = newIds;
    crossfadeTo(pickRandom(newIds, currentId));
  }

  function dismiss(who){
    initCtx();
    setSide(who);
    splash.style.opacity='0';
    setTimeout(()=>splash.style.display='none', 900);
    setTimeout(animateMainNames, 1000);
    // attach side-switch listeners to main name buttons
    mainGroom.style.cursor = 'pointer';
    mainBride.style.cursor  = 'pointer';
    mainGroom.addEventListener('click', ()=>switchSide('groom'));
    mainBride.addEventListener('click',  ()=>switchSide('bride'));
    // resume AudioContext (may be suspended on iOS/Android even after tap)
    const startAfterResume = () => startPlaylist(who==='groom' ? GROOM_IDS : BRIDE_IDS, who);
    if(audioCtx.state === 'suspended'){
      audioCtx.resume().then(startAfterResume);
    } else {
      startAfterResume();
    }
  }

  btnGroom.addEventListener('click',     ()=>dismiss('groom'), {once:true});
  btnGroom.addEventListener('touchstart',()=>dismiss('groom'), {once:true, passive:true});
  btnBride.addEventListener('click',     ()=>dismiss('bride'),  {once:true});
  btnBride.addEventListener('touchstart',()=>dismiss('bride'),  {once:true, passive:true});
})();

/* ── & spark effect ── */
(function(){
  const ampEl = document.getElementById('amp-el');
  function fireSpark(){
    if(!ampEl) return;
    const rect = ampEl.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top  + rect.height/2;
    for(let i=0;i<8;i++){
      const sp = document.createElement('div');
      document.body.appendChild(sp);
      const angle = (i/8)*Math.PI*2 + Math.random()*0.4;
      const dist  = 25+Math.random()*45;
      const tx = Math.cos(angle)*dist;
      const ty = Math.sin(angle)*dist;
      const size = 3+Math.random()*4;
      sp.style.cssText = `
        position:fixed;z-index:10;pointer-events:none;
        left:${cx}px;top:${cy}px;
        width:${size}px;height:${size}px;border-radius:50%;
        background:${Math.random()<0.6?'#e2c97e':'#fff8d0'};
        transform:translate(-50%,-50%);
        transition:transform ${0.45+Math.random()*0.3}s ease-out,opacity 0.55s ease-out;
        opacity:0.95;box-shadow:0 0 4px rgba(226,201,126,0.8);
      `;
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        sp.style.transform=`translate(calc(-50% + ${tx}px),calc(-50% + ${ty}px)) scale(0.1)`;
        sp.style.opacity='0';
      }));
      setTimeout(()=>sp.remove(), 900);
    }
    setTimeout(fireSpark, 3200+Math.random()*2500);
  }
  setTimeout(fireSpark, 2500);
})();

/* ── shimmer beams on names ── */
(function(){
  const beamL = document.getElementById('beam-ltr');
  const beamR = document.getElementById('beam-rtl');
  if(!beamL || !beamR) return;

  function sweep(beam, fromRight){
    const start = fromRight ? '120%' : '-80%';
    const end   = fromRight ? '-80%' : '120%';
    beam.style.transition = 'none';
    beam.style.left    = start;
    beam.style.opacity = '0';
    beam.offsetHeight; // reflow
    beam.style.transition = 'left 1.1s cubic-bezier(.4,0,.6,1), opacity 0.18s ease';
    beam.style.opacity = '1';
    beam.style.left    = end;
    setTimeout(() => { beam.style.opacity = '0'; }, 950);
  }

  function fire(){
    const r = Math.random();
    if(r < 0.45){
      sweep(beamL, false);          // left → right
    } else if(r < 0.8){
      sweep(beamR, true);           // right → left
    } else {
      sweep(beamL, false);          // both simultaneously
      setTimeout(() => sweep(beamR, true), 80);
    }
    // next fire: 3.5–5.5 seconds
    setTimeout(fire, 3500 + Math.random() * 2000);
  }

  setTimeout(fire, 1800); // first fire after entrance animation
})();
